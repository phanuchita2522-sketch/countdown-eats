const TXT={"th":"\n<p class=\"muted\">เวอร์ชัน {{VERSION}}</p>\n<h3>1. การยอมรับข้อตกลง</h3>\n<p>เมื่อเข้าสู่ระบบหรือใช้แอป ถือว่าคุณยอมรับข้อตกลงนี้และนโยบายความเป็นส่วนตัว หากไม่ยอมรับ โปรดอย่าใช้แอป แอปนี้ออกแบบสำหรับผู้มีอายุ 20 ปีขึ้นไป ผู้ที่อายุต่ำกว่า 20 ปีใช้งานทั่วไป (เช่น จองและซื้ออาหารหรือสินค้า) ได้ด้วยตนเองตามขอบเขตที่กฎหมายให้ผู้เยาว์ทำเองได้ ส่วนการเปิดร้านค้าหรือทำนิติกรรมที่เกินขอบเขตดังกล่าวต้องได้รับความยินยอมจากผู้ปกครอง</p>\n<h3>2. CountDown Eats คืออะไร</h3>\n<p>CountDown Eats เป็นแพลตฟอร์มให้ร้านค้าลงขายอาหารและสินค้าเหลือหรือใกล้หมดอายุในราคาลดพิเศษ และให้ผู้ซื้อจองเพื่อไปรับเอง <b>การซื้อขายเป็นสัญญาระหว่างผู้ซื้อกับร้านค้า</b> {{OPERATOR}} ไม่ใช่ผู้ขาย ไม่ได้ปรุง เก็บ ตรวจ หรือจัดส่งสินค้า และไม่ได้รับหรือถือเงินของคุณ</p>\n<h3>3. บัญชีผู้ใช้</h3>\n<p>เข้าสู่ระบบด้วยบัญชี Google ของคุณเอง รักษาความปลอดภัยของบัญชี ให้ข้อมูลที่ถูกต้อง และไม่สร้างหลายบัญชีเพื่อเลี่ยงข้อจำกัดหรือการระงับ คุณรับผิดชอบต่อการใช้งานในบัญชีของคุณ</p>\n<h3>4. การจอง การชำระเงิน และการรับของ (ผู้ซื้อ)</h3>\n<ul>\n<li>การจองกันสินค้าไว้ให้ <b>15 นาที</b> ในช่วงนี้คุณต้องโอนเงินให้ร้านโดยตรง (พร้อมเพย์คิวอาร์หรือโอนบัญชี) ตามยอดที่แสดง รวมเศษสตางค์ที่ใช้ระบุคำสั่งซื้อของคุณ แล้วกด \"โอนแล้ว\"</li>\n<li>ร้านจะยืนยันว่าได้รับเงิน เมื่อยืนยันแล้วคิวอาร์/รหัสรับของจึงใช้ได้ แสดงที่ร้านภายในเวลาขาย</li>\n<li>การจองที่ไม่ชำระจะถูกยกเลิกอัตโนมัติ การจองแล้วไม่ชำระซ้ำ ๆ หรือแจ้งว่าโอนแต่ร้านปฏิเสธ อาจถูกจำกัดการใช้งานชั่วคราว</li>\n<li>กล่องสุ่มมีสินค้าตามประเภทที่ระบุ รายการจริงอาจต่างกัน รายการอาหารใช้ได้ภายในวันนั้นเท่านั้น</li>\n<li>การคืนเงิน เปลี่ยนสินค้า และข้อร้องเรียน ให้ตกลงกับร้านค้า และคุณรายงานปัญหาในแอปได้</li>\n</ul>\n<h3>5. ร้านค้า</h3>\n<ul>\n<li>ต้องมีสิทธิขายสินค้าและปฏิบัติตามกฎหมายไทย (ความปลอดภัยอาหาร ฉลาก คุ้มครองผู้บริโภค ภาษี)</li>\n<li>คำอธิบาย ราคา รูป วันหมดอายุ และขนาด ต้องถูกต้อง เครื่องสำอางและอาหารเสริมต้องแสดงเลขทะเบียนที่ถูกต้อง และห้ามอวดอ้างสรรพคุณทางการแพทย์หรือ \"รักษาโรค\"</li>\n<li>ห้ามขาย: สินค้าผิดกฎหมาย ปลอม หรือได้มาโดยมิชอบ สินค้าที่เลยวันหมดอายุ ยาที่ต้องสั่งโดยแพทย์หรือยาควบคุม แอลกอฮอล์ บุหรี่และบุหรี่ไฟฟ้า อาวุธ สื่อลามก สัตว์มีชีวิต</li>\n<li>ข้อมูลรับเงินต้องเป็นของคุณหรือกิจการของคุณ ต้องรักษาการจองที่ยืนยันแล้วและอัปเดตสต็อกให้ตรง ห้ามใส่เบอร์โทร ลิงก์ หรือไอดีแชตในรายการสินค้า</li>\n<li>ต้องตรวจสอบแอปธนาคารก่อนกดยืนยันว่าได้รับเงิน การยืนยันทั้งที่ไม่ได้รับเงินเป็นความเสี่ยงของร้านเอง</li>\n</ul>\n<h3>5A. ร้านประเภทห้าง/มินิมาร์ทและการใช้ชื่อแบรนด์</h3>\n<ul>\n<li>ผู้ที่ลงทะเบียนร้านประเภทห้าง/มินิมาร์ท หรือใช้ชื่อ ตราสินค้า โลโก้ หรือชื่อสาขาของบุคคลอื่น <b>ต้องรับรองว่าตนเป็นเจ้าของ ผู้ได้รับอนุญาต หรือพนักงานที่ได้รับมอบหมายให้ดำเนินการสาขานั้นจริง</b> โดยกดยืนยันและให้ข้อมูลเพื่อตรวจสอบตอนลงทะเบียน</li>\n<li>ร้านประเภทนี้<b>จะยังไม่แสดงต่อลูกค้า</b>จนกว่าผู้ดูแลระบบอนุมัติ ผู้ดูแลระบบอาจขอหลักฐานเพิ่มเติม และอาจปฏิเสธหรือถอนการอนุมัติเมื่อเห็นว่าไม่น่าเชื่อถือ หากเปลี่ยนชื่อหรือแบรนด์ของสาขา ต้องรับรองและรอตรวจสอบใหม่</li>\n<li>ร้านประเภทนี้ที่เปิดใหม่ถูกจำกัดจำนวนสินค้าต่อรายการ (เช่น ไม่เกิน 10 ชิ้น) จนกว่าจะมีผู้ซื้อรับสินค้าสำเร็จตามเกณฑ์ที่ระบบกำหนด</li>\n<li>การแอบอ้างเป็นแบรนด์หรือสาขาของผู้อื่น หรือการให้ข้อมูลรับรองเท็จ เป็นการฝ่าฝืนข้อตกลงนี้อย่างร้ายแรง เราอาจซ่อนหรือลบร้านและระงับบัญชีทันทีโดยไม่ต้องแจ้งล่วงหน้า และอาจเปิดเผยข้อมูลที่เกี่ยวข้องต่อเจ้าของสิทธิ์หรือหน่วยงานที่มีอำนาจตามที่กฎหมายกำหนด <b>ผู้ลงทะเบียนเป็นผู้รับผิดชอบแต่เพียงผู้เดียว</b>ต่อความเสียหายที่เกิดจากการแอบอ้างหรือการให้ข้อมูลเท็จของตน</li>\n<li>แบรนด์ที่ปรากฏในแอปไม่ได้หมายความว่าแบรนด์นั้นเป็นหุ้นส่วน ผู้สนับสนุน หรือรับรองแอปนี้</li>\n</ul>\n<h3>6. พฤติกรรมที่ห้าม</h3>\n<p>การฉ้อโกง สลิปปลอมหรือตัดต่อ รายงานหรือคะแนนเท็จ การข่มขู่หรือล่วงละเมิดผู้อื่น การหลบเลี่ยงหรือแก้ไขแอป API หรือข้อจำกัดของระบบ การดึงข้อมูลอัตโนมัติ การอัปโหลดเนื้อหาผิดกฎหมายหรือละเมิดสิทธิ์ และการใช้แอปเพื่อชักชวนผู้อื่นออกนอกระบบไปหลอกลวง</p>\n<h3>6A. การแจ้งรายงานร้านปลอมหรือการละเมิดสิทธิ์</h3>\n<ul>\n<li>{{OPERATOR}} เป็นผู้ให้บริการแพลตฟอร์ม ร้านค้าและเนื้อหาในร้านเป็นของผู้ใช้แต่ละราย เราไม่ได้ตรวจสอบเนื้อหาทุกรายการล่วงหน้า</li>\n<li>ผู้ใช้หรือเจ้าของสิทธิ์ที่พบร้านแอบอ้างแบรนด์ ละเมิดลิขสิทธิ์ เครื่องหมายการค้า รูปภาพ หรือเป็นร้านปลอม แจ้งได้ที่ปุ่ม \"รายงานร้านปลอม/ละเมิดลิขสิทธิ์\" ในหน้าร้าน หรือส่งอีเมลมาที่ {{CONTACT}} โดยระบุ ชื่อร้านในแอป เหตุผล หลักฐาน ข้อมูลที่แสดงว่าท่านเป็นเจ้าของสิทธิ์หรือผู้ได้รับมอบหมาย และช่องทางติดต่อกลับ</li>\n<li>เมื่อได้รับแจ้ง เราจะตรวจสอบโดยเร็วตามสมควร และอาจซ่อนร้านระหว่างตรวจสอบ ปฏิเสธ หรือลบร้านหรือเนื้อหานั้น ผู้แจ้งต้องให้ข้อมูลตามจริง การแจ้งเท็จหรือกลั่นแกล้งอาจทำให้บัญชีถูกระงับและอาจมีความรับผิดตามกฎหมาย ข้อมูลของผู้แจ้งจะไม่ถูกส่งให้ร้านที่ถูกแจ้ง เว้นแต่กฎหมายกำหนดหรือจำเป็นเพื่อการดำเนินคดี</li>\n<li>เจ้าของร้านที่เห็นว่าถูกซ่อนหรือปฏิเสธโดยผิดพลาด ติดต่อ {{CONTACT}} พร้อมหลักฐานเพื่อขอให้ทบทวน</li>\n</ul>\n<h3>7. มาตรการความปลอดภัย</h3>\n<p>เราใช้มาตรการทั้งอัตโนมัติและโดยเจ้าหน้าที่ป้องกันการโกง ได้แก่ จำกัดจำนวนการจองที่ค้างอยู่ ล็อกเมื่อไม่ชำระ จำกัดร้านใหม่ ซ่อนร้านหลังมีรายงานที่ยืนยันแล้ว และระงับบัญชี เราอาจระงับหรือลบบัญชี รายการ หรือเนื้อหาที่ฝ่าฝืนข้อตกลงนี้ คุณขอให้ทบทวนการตัดสินใจได้ที่ {{CONTACT}}</p>\n<h3>7A. บันทึกการยอมรับข้อกำหนด</h3>\n<p>เมื่อคุณกดยอมรับข้อกำหนดการใช้งาน ข้อกำหนดสำหรับร้านค้า หรือการรับรองตัวตนสาขา ระบบจะบันทึก <b>วันและเวลา เวอร์ชันของข้อกำหนด รหัสบัญชี ที่อยู่ IP และชนิดอุปกรณ์/เบราว์เซอร์</b> ไว้เป็นหลักฐาน คุณดาวน์โหลดประวัติการยอมรับของคุณได้ที่ โปรไฟล์ → ข้อมูลของฉัน ข้อมูลนี้เก็บไว้เท่าที่จำเป็นเพื่อเป็นหลักฐานทางกฎหมาย (ดูนโยบายความเป็นส่วนตัว)</p>\n<h3>8. ความปลอดภัยของอาหารและสารก่อภูมิแพ้</h3>\n<p>ร้านค้าเป็นผู้รับผิดชอบความปลอดภัย สุขอนามัย ฉลาก และข้อมูลสารก่อภูมิแพ้ของสินค้าที่ขาย ผู้ซื้อควรตรวจสินค้าตอนรับและไม่บริโภคสิ่งที่เสียหรือมีกลิ่นผิดปกติ แอปไม่ได้ตรวจสอบความปลอดภัยของอาหาร</p>\n<h3>9. บริการฟรี โฆษณา และผู้สนับสนุน</h3>\n<p>แอปใช้ฟรีสำหรับผู้ซื้อและร้านค้า เราอาจหารายได้จากโฆษณา ผู้สนับสนุน หรือเงินบริจาค โฆษณาและผู้สนับสนุนไม่ถือเป็นการรับรองสินค้านั้นโดยเรา</p>\n<h3>9A. เครดิตระบบและค่าบริการของร้านค้า</h3>\n<p>ส่วนนี้ใช้กับร้านค้าที่เติมเครดิต (ร้านต้องกดยอมรับ \"เงื่อนไขการเติมเงินและการใช้เครดิตระบบ\" ในแอปก่อนเติมเครดิตครั้งแรก):</p>\n<ul><li>เครดิตระบบคือยอดเงินที่ร้านค้าเติมล่วงหน้าเพื่อชำระค่าบริการแพลตฟอร์ม ไม่ใช่เงินฝากหรือบัญชีเงินออม ไม่มีดอกเบี้ย</li><li>ร้านค้าเติมเครดิตด้วยการโอนพร้อมเพย์ตามยอดที่แอประบุ (มีเศษสตางค์ไว้จับคู่รายการ เครดิตที่ได้นับเป็นจำนวนเต็มบาท) เครดิตเข้าหลังผู้ดูแลหรือระบบตรวจสอบยอดแล้ว</li><li>เมื่อเปิดใช้ค่าบริการ ระบบหักค่าบริการตามอัตราที่แสดงในแอป (ปัจจุบัน อัตราที่แสดงในแอป % ของยอดขายแต่ละออเดอร์ ยกเว้นตู้เย็นชุมชน) เมื่อร้านยืนยันรับของ ระบบกันวงเงินเครดิตไว้ตอนมีออเดอร์ หากเครดิตไม่พอ ร้านจะลงขายรายการใหม่หรือรับออเดอร์ใหม่ไม่ได้ จนกว่าจะเติมเพิ่ม</li><li>ยอดขายที่ลูกค้าจ่ายให้ร้านโดยตรงเป็นของร้านค้า แพลตฟอร์มไม่ได้รับหรือถือเงินส่วนนั้น</li><li>ค่าบริการอาจเปลี่ยนอัตราได้ โดยแจ้งในแอปล่วงหน้า ออเดอร์ที่สร้างแล้วใช้อัตราเดิม</li><li>เครดิตที่เติมแล้วไม่สามารถถอนเป็นเงินสดและไม่โอนให้ผู้อื่น ยกเว้นกรณีปิดบริการหรือระบบหักผิดพลาด ซึ่งผู้ดูแลจะคืนหรือปรับยอดตามจริง</li><li>ใบเสร็จออกให้ทุกครั้งที่เติมเครดิต แสดงยอดก่อนภาษี ภาษีมูลค่าเพิ่ม (ถ้าผู้ให้บริการจดทะเบียน) และยอดรวม ข้อมูลผู้ให้บริการเป็นไปตามที่ระบุในใบเสร็จ ณ วันที่ออก</li><li>หากพบการโอนผิดยอดหรือผิดบัญชี ให้ติดต่อผู้ดูแลพร้อมสลิป ผู้ดูแลอาจระงับการใช้เครดิตระหว่างตรวจสอบ ข้อมูลสลิปใช้เพื่อตรวจสอบการชำระเงินเท่านั้น (ดูนโยบายความเป็นส่วนตัว)</li><li>ผู้ดูแลระงับหรือปิดบัญชีร้านที่ฉ้อโกงหรือผิดข้อกำหนดได้ และอาจเปลี่ยนเงื่อนไขนี้โดยแจ้งในแอป การเติมเครดิตครั้งถัดไปถือว่ายอมรับเงื่อนไขฉบับใหม่</li></ul>\n<h3>10. เนื้อหา</h3>\n<p>คุณยังเป็นเจ้าของรูปและข้อความที่อัปโหลด และอนุญาตให้เราแสดงในแอปแบบไม่ผูกขาดตราบที่คุณยังคงไว้ คุณรับรองว่ามีสิทธิอัปโหลดเนื้อหานั้น</p>\n<h3>11. การปฏิเสธและจำกัดความรับผิด</h3>\n<p>แอปให้บริการ \"ตามสภาพ\" อาจใช้งานไม่ได้หรือมีข้อผิดพลาด ภายในขอบเขตสูงสุดที่กฎหมายอนุญาต เราไม่รับผิดชอบต่อสินค้า คุณภาพหรือความปลอดภัยของสินค้า พฤติกรรมของร้านค้าหรือผู้ซื้อ การชำระเงินที่ล้มเหลวหรือเป็นข้อพิพาท หรือความเสียหายทางอ้อม ข้อตกลงนี้ไม่ได้ยกเว้นความรับผิดที่กฎหมายไทยไม่ให้ยกเว้น (เช่น การกระทำโดยเจตนาหรือประมาทเลินเล่ออย่างร้ายแรง) และไม่จำกัดสิทธิของคุณในฐานะผู้บริโภค</p>\n<h3>12. การเลิกใช้งาน</h3>\n<p>คุณเลิกใช้และลบบัญชีได้ทุกเมื่อ (โปรไฟล์ → ข้อมูลของฉัน) โดยต้องดำเนินการคำสั่งซื้อที่ชำระแล้วและยังค้างอยู่ให้เสร็จหรือยกเลิกก่อน เราอาจระงับหรือยุติการเข้าถึงหากฝ่าฝืนข้อตกลง</p>\n<h3>13. การเปลี่ยนแปลง</h3>\n<p>เราอาจแก้ไขข้อตกลงนี้ หากเปลี่ยนในสาระสำคัญ จะขอให้คุณยอมรับก่อนใช้งานการจองหรือจัดการคำสั่งซื้อต่อ</p>\n<h3>14. กฎหมายที่ใช้บังคับ</h3>\n<p>ข้อตกลงนี้อยู่ภายใต้กฎหมายไทย และศาลไทยมีเขตอำนาจ โดยไม่กระทบสิทธิของผู้บริโภคตามกฎหมาย</p>\n<h3>15. ติดต่อ</h3>\n<p>{{OPERATOR}} · {{ADDRESS}} · {{CONTACT}}</p>\n","en":"\n<p class=\"muted\">Version {{VERSION}}</p>\n<h3>1. Acceptance</h3>\n<p>By signing in or using the App you agree to these Terms and to the Privacy Policy. If you do not agree, do not use the App. The App is designed for people aged 20 or over. People under 20 may use it for everyday purposes (such as reserving and buying food or goods) on their own, to the extent the law allows minors to act without a guardian. Opening a shop, or any act beyond that scope, requires a parent's or guardian's consent.</p>\n<h3>2. What CountDown Eats is</h3>\n<p>CountDown Eats is a platform that lets shops list surplus or near-expiry food and other goods at a discount and lets buyers reserve them for pickup. <b>The sale is a contract between the buyer and the shop.</b> {{OPERATOR}} is not the seller, does not prepare, store, inspect or deliver goods, and does not receive or hold your money.</p>\n<h3>3. Accounts</h3>\n<p>Sign in with your own Google account. Keep it secure, give accurate information, and do not create multiple accounts to evade limits or bans. You are responsible for activity on your account.</p>\n<h3>4. Reservations, payment and pickup (buyers)</h3>\n<ul>\n<li>A reservation holds the item for <b>15 minutes</b> while you pay the shop directly (PromptPay QR or bank transfer) the exact amount shown, including the extra satang that identifies your order. Then press \"I have paid\".</li>\n<li>The shop confirms it received your transfer. Only after confirmation does your pickup QR / code become valid. Show it at the shop within the sale window.</li>\n<li>Unpaid reservations are cancelled automatically. Repeated unpaid reservations, or claiming payment that shops reject, can lead to temporary limits.</li>\n<li>Mystery boxes contain a mix of the types shown; exact items vary. Food listings are valid for the same day only.</li>\n<li>Refunds, exchanges and complaints are handled between you and the shop; you can also report a problem in the App.</li>\n</ul>\n<h3>5. Shops</h3>\n<ul>\n<li>You must be entitled to sell the goods and comply with Thai law (food safety, labelling, consumer protection, tax).</li>\n<li>Descriptions, prices, photos, expiry dates and sizes must be accurate. Cosmetics and supplements must show a valid registration number and make no medical or \"cure\" claims.</li>\n<li>Not allowed: illegal, counterfeit or stolen goods; goods past their use-by date; prescription or controlled medicines; alcohol, tobacco and e-cigarettes; weapons; adult content; live animals.</li>\n<li>Payment-receiving details must belong to you or your business. You must honour confirmed reservations and keep stock accurate. Do not put phone numbers, links or messaging IDs in listings.</li>\n<li>You must check your bank app before confirming a payment. Confirming a payment you did not receive is your own risk.</li>\n</ul>\n<h3>5A. Chain / mall / minimart shops and use of brand names</h3>\n<ul>\n<li>Anyone who registers a chain, mall or minimart shop, or uses another party's name, trademark, logo or branch name, <b>must declare that they are the owner, an authorised party, or a staff member entrusted to run that branch</b>, by ticking the declaration and giving verification details at registration.</li>\n<li>Such shops are <b>not shown to customers</b> until an administrator approves them. We may ask for more evidence and may reject or withdraw approval if the shop does not look genuine. If the branch name or brand changes, the declaration and review must be repeated.</li>\n<li>Newly opened shops of this type have a cap on the quantity per listing (for example 10 units) until enough buyers have successfully collected goods, under rules set by the system.</li>\n<li>Impersonating another party's brand or branch, or giving a false declaration, is a serious breach of these Terms. We may hide or remove the shop and suspend the account immediately without notice, and may disclose relevant information to the rights holder or competent authorities as required by law. <b>The registrant is solely responsible</b> for any damage caused by their impersonation or false statements.</li>\n<li>A brand appearing in the App does not mean that the brand is a partner or sponsor of, or endorses, this App.</li>\n</ul>\n<h3>6. Prohibited conduct</h3>\n<p>Fraud; fake or edited payment slips; false reports or ratings; abusing or threatening others; bypassing or tampering with the App, its API or limits; scraping; uploading unlawful or infringing content; using the App to take people off the platform to scam them.</p>\n<h3>6A. Reporting fake shops and infringement</h3>\n<ul>\n<li>{{OPERATOR}} operates the platform. Shops and the content in them belong to individual users, and we do not review every item in advance.</li>\n<li>Users and rights holders who find a shop impersonating a brand, infringing copyright, trademarks or photos, or that is fake, can use the \"Report fake shop / infringement\" button on the shop page, or email {{CONTACT}} with the shop name as shown in the App, the reason, evidence, information showing that you are the rights holder or its representative, and a way to contact you.</li>\n<li>When notified we will review within a reasonable time and may hide the shop while we check, reject it, or remove the shop or the content. Reporters must be truthful; false or malicious reports may lead to account suspension and legal liability. The reporter's details are not passed to the reported shop unless the law requires it or it is necessary for legal proceedings.</li>\n<li>A shop owner who believes a shop was hidden or rejected by mistake can contact {{CONTACT}} with evidence and ask for a review.</li>\n</ul>\n<h3>7. Safety measures</h3>\n<p>We use automatic and manual measures against fraud: limits on open reservations, unpaid-order lock, new-shop limits, hiding shops after confirmed reports, and banning accounts. We may suspend or remove accounts, listings or content that breach these Terms. You may ask us to review a decision at {{CONTACT}}.</p>\n<h3>7A. Records of acceptance</h3>\n<p>When you accept the Terms of Use, the Shop Terms, or declare your branch identity, the system records <b>the date and time, the version of the terms, your account ID, your IP address and your device/browser type</b> as evidence. You can download your acceptance history at Profile → My data. This data is kept only as long as needed as legal evidence (see the Privacy Policy).</p>\n<h3>8. Food safety and allergens</h3>\n<p>Shops are responsible for the safety, hygiene, labelling and allergen information of what they sell. Buyers should check the item at pickup and not consume anything that looks or smells spoiled. The App does not verify food safety.</p>\n<h3>9. Free service, ads, sponsors</h3>\n<p>The App is free for buyers and shops. We may fund it with advertising, sponsors or donations. Ads and sponsors are not endorsements by us of the advertised products.</p>\n<h3>9A. Platform credit and shop fees</h3>\n<p>This applies to shops that top up credit (shops must accept the in-app \"Top-up and Platform Credit Terms\" before their first top-up):</p>\n<ul><li>Platform credit is prepaid money used to pay platform service fees. It is not a deposit and earns no interest.</li><li>Top up by PromptPay transfer for the amount shown (extra satang only match your transfer; credit is whole baht). Credit is added once the transfer is verified.</li><li>When fees are enabled, the platform deducts the fee shown in the app (the rate shown in the app, % of each order, community fridge excluded) when you confirm pickup. Credit is reserved for open orders. With insufficient credit you cannot list items or take new orders until you top up.</li><li>Sales paid by customers go directly to the shop; the platform does not hold that money.</li><li>Fee rates may change with notice in the app; existing orders keep their rate.</li><li>Credit is non-refundable in cash and non-transferable, except if the service closes or a deduction error occurs, which the admin will correct.</li><li>A receipt is issued per top-up showing amount before tax, VAT (if the provider is VAT-registered) and total, with provider details as of issue date.</li><li>Report wrong amounts or accounts with your slip. Credit may be frozen during review. Slip data is used only to verify payment.</li><li>The admin may suspend fraudulent or non-compliant shops and update these terms with notice; topping up again means accepting the new version.</li></ul>\n<h3>10. Content</h3>\n<p>You keep ownership of photos and text you upload and give us a non-exclusive licence to display them in the App for as long as you keep them there. You confirm you have the right to upload them.</p>\n<h3>11. Disclaimer and limit of liability</h3>\n<p>The App is provided \"as is\" and may be unavailable or contain errors. To the maximum extent permitted by law, we are not liable for goods, their quality or safety, shops' or buyers' conduct, failed or disputed payments, or indirect losses. Nothing in these Terms excludes liability that cannot be excluded under Thai law (such as for intentional or grossly negligent acts) or limits your rights as a consumer.</p>\n<h3>12. Ending use</h3>\n<p>You may stop using the App and delete your account at any time (Profile → My data). Open paid orders must be completed or cancelled first. We may suspend or
