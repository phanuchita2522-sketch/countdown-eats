:root{
  --bg:#fff6e6; --card:#ffffff; --text:#241a33; --muted:#7b6f8a; --line:#f0dfc2;
  --ink:#1b1530; --chili:#e8412c; --lantern:#ffb02e; --jade:#13a06f; --soft:#fff0d2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#140f22;--card:#211a36;--text:#fbf1de;--muted:#aaa0bd;--line:#35294f;--soft:#2c2243;}
}
:root[data-theme="dark"]{--bg:#140f22;--card:#211a36;--text:#fbf1de;--muted:#aaa0bd;--line:#35294f;--soft:#2c2243;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.display{font-family:'Mitr','Sarabun',sans-serif}
/* CJK: Mitr/Sarabun have no Han/Kana glyphs, so switch families per language */
html[lang="en"] .display{font-family:'Mitr','Sarabun',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.muted{color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{background:var(--chili);color:#fff;font-weight:700;border-radius:14px;padding:12px 18px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--ink)} .btn.jade{background:var(--jade)} .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
input,select,textarea{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}

.hdr{background:var(--bg);transition:background .4s}
.night .hdr{background:radial-gradient(120% 140% at 80% 0%,#4b2a6b 0%,#1b1530 60%);color:#fff}
.night .hdr .muted{color:#d4c6ec}
.night .hdr .chip{background:#ffffff18;color:#fff;border-color:#ffffff33}
.bulbs{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:-2px}
.bulbs i{width:14px;height:20px;border-radius:50% 50% 45% 45%;background:var(--lantern);box-shadow:0 0 12px 3px rgba(255,176,46,.7);display:block;animation:glow 2.4s infinite}
.bulbs i:nth-child(2n){background:var(--chili);box-shadow:0 0 12px 3px rgba(232,65,44,.6);animation-delay:.6s}
.bulbs i:nth-child(3n){animation-delay:1.1s}
@keyframes glow{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}}

.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;
  -webkit-mask:radial-gradient(circle 10px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 10px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.perf{border-top:2px dashed var(--line)}
.digits{font-family:'Mitr',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sheet{position:fixed;inset:0;background:rgba(10,6,20,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;padding:8px 2px 6px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.nav button.on{color:var(--chili)}
.nav button span.ic{font-size:22px;display:block;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--jade)}
.legal h3{font-weight:700;margin:14px 0 4px}.legal ul{list-style:disc;padding-left:20px}.legal li{margin:3px 0}.legal p{margin:4px 0}

const Notify={
  plugin(){ try{ return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications; }catch(e){ return null; } },
  async scheduleDaily(id,hour,minute,title,body){
    const P=this.plugin(); if(!P) return false;
    try{
      const perm=await P.requestPermissions(); if(perm.display!=='granted') return false;
      await P.cancel({notifications:[{id}]});
      await P.schedule({notifications:[{id,title,body,schedule:{on:{hour,minute},allowWhileIdle:true}}]});
      return true;
    }catch(e){ return false; }

  },
  async cancel(id){ const P=this.plugin(); if(!P) return; try{ await P.cancel({notifications:[{id}]}); }catch(e){} }
};

/* ---------- Shared database (free): orders, stock and shops synced across devices ----------
   Runs on the artifact `db` capability (free, realtime) — or any Firestore-style backend a host app injects as
   window.CDE_BACKEND={db,uid}. Without either, the app stays fully local.
   Every user writes ONLY their own document in each collection (orders/<uid>, shops/<uid>, ...), which the db rules enforce:
     shops/<owner>     the owner's shop catalogue (no photos)
     imgs/<owner>      small thumbnails of the owner's items
     orders/<buyer>    the buyer's recent orders (public part only: no pickup code, only its SHA-256, no PIN, no address)
     confirms/<owner>  the shop owner's handover/pickup confirmations (a buyer trusts a confirm only from that shop's owner)
   Stock is DERIVED: left = qty − Σ orders for that listing since it was (re)opened. No shared counters to corrupt.
   Known limits: two buyers taking the last unit at the same instant can both succeed (no transactions); shop trust/score
   is self-reported; real launch needs server-side checks (payments, KYC, moderation). */
let cleanShopFn=null, cleanOrderFn=null;
const PH_IMG='data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%204%204%27%3E%3Crect%20width=%274%27%20height=%274%27%20fill=%27%23ddd%27/%3E%3C/svg%3E';
const RANK={pending:0,review:1,paid:2,assigned:2,picked:2,done:3,expired:3,cancelled:3}, rank=s=>RANK[s]!=null?RANK[s]:0;
const PAY_HOLD=15*60000;                                                  // an unpaid reservation holds stock this long
async function chash(code){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(code))); return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
function thumbOf(src){
  return new Promise(res=>{ try{
    const im=new Image();
    im.onload=()=>{ try{ const k=Math.min(1,260/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.5)); }catch(e){ res(''); } };
    im.onerror=()=>res(''); im.src=src;
  }catch(e){ res(''); } });
}
const cloudShop=sh=>!!(Cloud.on&&sh&&(sh.remote||sh.mine));
function soldFor(sh,lk,rid,ep){
  const seen=new Set(); let n=0;
  const add=(id,e)=>{ if(seen.has(id)) return; seen.add(id); if(e.status==='cancelled'||(e.status==='pending'&&Date.now()>+e.ts+PAY_HOLD)) return; if(+e.shopId===sh.id&&e.lk===lk&&e.lid===rid&&+e.ts>=ep) n+=Math.min(MAX_QTY,Math.max(1,Math.floor(+e.qty||1))); };
  S.orders.forEach(o=>add(String(o.id),o)); Cloud.claims.forEach((e,id)=>add(id,e));
  return n;
}
function applyStock(){
  let ch=false;
  S.shops.forEach(sh=>{ if(!cloudShop(sh)) return;
    [['item',sh.items],['bundle',sh.bundles],['box',sh.sets]].forEach(([lk,L])=>L.forEach(r=>{
      const l=Math.max(0,r.qty-soldFor(sh,lk,r.id,r.ep||0));
      if(l!==r.left){ if(sh.mine&&r.left>0&&l===0) pushNotice(sh,{type:'soldout',kind:lk,name:lk==='item'?r.name:(lk==='bundle'?(r.name||''):''),n:lk==='box'?setN(r):(r.itemIds?r.itemIds.length:1)}); r.left=l; ch=true; }
      if(l<=0&&!r.soldAt){ r.soldAt=Date.now(); ch=true; } else if(l>0&&r.soldAt){ r.soldAt=0; ch=true; }
    }));
  });
  return ch;
}
/* ---------- Optional free backend: Supabase (Free plan) ----------
   Fill CDE_SUPABASE with your project URL + anon (public) key to switch the shared database from the preview host to Supabase.
   Run supabase-setup.sql once in the Supabase SQL editor first (table + row-level-security: each user can write only their own doc).
   Identity here is Supabase *anonymous* sign-in = one id per browser/device storage. Before a real launch switch to phone/Google login,
   otherwise clearing app data loses the owner's shops. The anon key is public by design; security comes from the RLS policies. */
window.CDE_SUPABASE=window.CDE_SUPABASE||{url:'',key:''};
const SB_COLS=['shops','imgs','orders','confirms'];
async function sbBackend(cfg){
  if(!window.supabase){ await new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
  const cl=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
  let ses=(await cl.auth.getSession()).data.session;
  if(!ses){ const r=await cl.auth.signInAnonymously(); if(r.error||!r.data||!r.data.session) throw (r.error||new Error('auth')); ses=r.data.session; }
  const uid=String(ses.user.id);
  const db={
    doc:path=>{ const [col,id]=String(path).split('/'); return {path,id,async set(d){
      if(!SB_COLS.includes(col)||id!==uid) throw {code:'invalid_argument'};
      const r=await cl.from('cde_docs').upsert({col,id,data:d,updated_at:new Date().toISOString()});
      if(r.error) throw {code:(r.error.code==='42501'||r.error.code==='23514')?'invalid_argument':'unavailable'};
    }}; },
    collection:col=>({onSnapshot(cb){
      let dead=false,timer=0;
      const pull=async()=>{ const r=await cl.from('cde_docs').select('id,data').eq('col',col); if(dead||r.error||!Array.isArray(r.data)) return; const docs=r.data.map(x=>({id:String(x.id),exists:true,data:()=>x.data})); cb({docs,size:docs.length,empty:!docs.length}); };
      pull();
      const ch=cl.channel('cde-'+col).on('postgres_changes',{event:'*',schema:'public',table:'cde_docs',filter:'col=eq.'+col},()=>{ clearTimeout(timer); timer=setTimeout(pull,300); }).subscribe();
      return ()=>{ dead=true; clearTimeout(timer); try{ cl.removeChannel(ch); }catch(e){} };
    }})
  };
  return {db,uid,client:cl,user:ses.user};
}
const Cloud={
  db:null,uid:'',on:false,ro:false,subs:[],rawShops:{},imgs:{},ordersDocs:{},confirms:{},sb:null,sbUser:null,claims:new Map(),blocked:new Set(),flagged:new Set(),done:{},hashes:{},thumbs:{},q:Promise.resolve(),timer:0,rt:0,
  async init(){
    try{
      let db=null,uid='';
      const ext=window.CDE_BACKEND;
      if(ext&&ext.db&&ext.uid){ db=ext.db; uid=String(ext.uid); }
      else if(window.CDE_SUPABASE&&window.CDE_SUPABASE.url&&window.CDE_SUPABASE.key){ const b=await sbBackend(window.CDE_SUPABASE); db=b.db; uid=b.uid; this.sb=b.client; this.sbUser=b.user; if(PROD) syncAuth(b.user); }
      else if(window.claude&&typeof window.claude.use==='function'){
        db=await window.claude.use('db'); const u=await window.claude.use('user'); const id=u?await u.id():null;
        if(db&&id) uid=String(id); else db=null;

      this.db=db; this.uid=uid; this.on=true; this.subscribe(); this.schedule(); queueRender();
    }catch(e){ this.on=false; }
  },
  w(path,data){
    this.q=this.q.then(()=>this.db.doc(path).set(data)).catch(e=>{ if(e&&e.code==='invalid_argument'){ this.ro=true; queueRender(); } });
    return this.q;
  },
  schedule(){ if(!this.on) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),700); },
  async flush(){
    if(!this.on||this.ro) return; const me=this.uid, H=this.hashes;
    const mine=S.shops.filter(x=>x.mine&&x.verified&&!x.remote);
    if(mine.length){
      const sd=mine.map(sh=>{ const c=JSON.parse(JSON.stringify(sh)); c.items.forEach(m=>{ m.img=''; }); delete c.remote; delete c.owner; return c; });
      const h=JSON.stringify(sd);
      if(H.shops!==h){ H.shops=h; await this.w('shops/'+me,{shops:sd,u:Date.now()}); }
      const f={}; let size=0;
      for(const sh of mine) for(const m of sh.items){
        const key=sh.id+'_'+m.id; if(!(key in this.thumbs)) this.thumbs[key]=await thumbOf(m.img);
        const th=this.thumbs[key]; if(th&&size+th.length<=230000){ f[key]=th; size+=th.length; }
      }
      const ih=Object.entries(f).map(([k,v])=>k+':'+v.length).join(',');
      if(H.imgs!==ih){ H.imgs=ih; await this.w('imgs/'+me,{f,u:Date.now()}); }
    }
    const cut=Date.now()-3*864e5, mo={};
    S.orders.filter(o=>o.buyer==='me'&&o.cloud&&o.ch&&(o.ts>cut||((o.cl||o.rp)&&o.ts>Date.now()-WIN30))).forEach(o=>{
      mo[o.id]={sat:o.sat||0,cl:o.cl?1:0,rp:o.rp||'',shopId:o.shopId,lk:o.lk,lid:o.lid,qty:o.qty,ts:o.ts,status:o.status,ch:o.ch,name:o.name,emoji:o.emoji,kind:o.kind,n:o.n,mix:o.mix,itemName:o.itemName,bundleName:o.bundleName,price:o.price,fee:o.fee,worth:o.worth,foodN:o.foodN,nonN:o.nonN,mode:o.mode,provider:o.provider};
    });
    const oh=JSON.stringify(mo);
    if(H.orders!==oh&&(H.orders!==undefined||Object.keys(mo).length)){ H.orders=oh; await this.w('orders/'+me,{o:mo,u:Date.now()}); }
    const cf={}; S.orders.filter(o=>o.buyer==='remote'&&['paid','done','cancelled'].includes(o.status)&&o.ts>Date.now()-WIN30).forEach(o=>{ cf[o.id]={s:o.status}; });
    const ch=JSON.stringify(cf);
    if(H.confirms!==ch&&(H.confirms!==undefined||Object.keys(cf).length)){ H.confirms=ch; await this.w('confirms/'+me,{c:cf,u:Date.now()}); }
  },
  subscribe(){
    const d=this.db, err=e=>{ if(e&&e.code==='revoked'){ this.on=false; queueRender(); } };
    const docs=(snap,fn)=>{ try{ snap.docs.forEach(x=>{ const v=x.data(); if(v&&typeof v==='object') fn(String(x.id),v); }); }catch(e){} };
    this.subs.push(d.collection('shops').onSnapshot(s=>{ this.rawShops={}; docs(s,(id,v)=>{ if(Array.isArray(v.shops)) this.rawShops[id]=v.shops.slice(0,MAX_SHOPS); }); this.rebuildShops(); },err));
    this.subs.push(d.collection('imgs').onSnapshot(s=>{ this.imgs={}; docs(s,(id,v)=>{ if(v.f&&typeof v.f==='object') this.imgs[id]=v.f; }); this.rebuildShops(); },err));
    this.subs.push(d.collection('orders').onSnapshot(s=>{ this.ordersDocs={}; docs(s,(id,v)=>{ if(v.o&&typeof v.o==='object') this.ordersDocs[id]=v.o; }); this.ingestOrders(); },err));
    this.subs.push(d.collection('confirms').onSnapshot(s=>{ this.confirms={}; docs(s,(id,v)=>{ if(v.c&&typeof v.c==='object') this.confirms[id]=v.c; }); this.ingestConfirms(); },err));
  },
  withImgs(uid,raw){
    const f=this.imgs[uid]||{}, c=JSON.parse(JSON.stringify(raw));
    c.items=(Array.isArray(c.items)?c.items:[]).map(m=>({...m,img:(typeof f[c.id+'_'+(m&&m.id)]==='string'&&safeImg(f[c.id+'_'+(m&&m.id)]))||PH_IMG}));
    return c;
  },
  rebuildShops(){
    if(!cleanShopFn) return;
    const have=new Set(S.shops.filter(x=>!x.remote).map(x=>x.id)), out=[]; let imported=false;
    for(const [uid,list] of Object.entries(this.rawShops)){
      for(const raw of list){
        if(!raw||!Number.isFinite(+raw.id)||have.has(Math.floor(+raw.id))) continue;
        if(uid===this.uid){ const sh=cleanShopFn(this.withImgs(uid,{...raw,mine:true,verified:true})); if(sh){ S.shops.push(sh); have.add(sh.id); imported=true; } continue; }   // my own shop from another device
        const sh=cleanShopFn(this.withImgs(uid,{...raw,mine:false,verified:true}));
        if(sh){ sh.remote=true; sh.owner=uid; out.push(sh); have.add(sh.id); }
      }
    }
    S.shops=S.shops.filter(x=>!x.remote).concat(out);
    applyStock(); if(imported) save(); queueRender();
  },
  analyze(){
    const now=Date.now(), strikes={}, reps={}, dn={}, byId=new Map(S.shops.map(s=>[s.id,s]));
    for(const [uid,map] of Object.entries(this.ordersDocs)){
      for(const [oid,e] of Object.entries(map||{})){
        if(!e||typeof e!=='object'||!(+e.ts>now-WIN30)) continue;
        const sid=Math.floor(+e.shopId), sh=byId.get(sid); if(!sh) continue;
        const ow=ownerOf(sh); if(!ow||ow===uid) continue;
        const c=this.confirms[ow]&&this.confirms[ow][oid]; if(!c) continue;
        if(c.s==='done') (dn[sid]=dn[sid]||new Set()).add(uid);
        if(c.s==='cancelled'&&e.cl===1) (strikes[uid]=strikes[uid]||new Set()).add(ow);
        if((c.s==='paid'||c.s==='done')&&RP.includes(e.rp)) (reps[sid]=reps[sid]||new Set()).add(uid);
      }
    }
    this.blocked=new Set(Object.keys(strikes).filter(u=>strikes[u].size>=STRIKE_N));
    this.flagged=new Set(Object.keys(reps).filter(k=>reps[k].size>=REPORT_N).map(Number));
    this.done=Object.fromEntries(Object.keys(dn).map(k=>[k,dn[k].size]));
  },
  ingestOrders(){
    this.analyze(); this.claims=new Map(); let ch=false;
    for(const [uid,map] of Object.entries(this.ordersDocs)){
      const ents=Object.entries(map).sort((a,b)=>(+(b[1]&&b[1].ts)||0)-(+(a[1]&&a[1].ts)||0)).slice(0,30);      // abuse guard: newest 30 entries per user
      let unconf=0;
      for(const [oid,e] of ents){
        if(!e||typeof e!=='object'||!Number.isFinite(+e.shopId)) continue;
        const shX=S.shops.find(x=>x.id===Math.floor(+e.shopId)), owX=shX?ownerOf(shX):'', cfX=owX&&this.confirms[owX]&&this.confirms[owX][oid], okX=!!(cfX&&(cfX.s==='paid'||cfX.s==='done'));
        if(this.blocked.has(uid)&&!okX) continue;                          // blocked buyers cannot hold stock or create orders
        if(!okX&&(e.status==='review'||(e.status==='pending'&&Date.now()<=+e.ts+PAY_HOLD))&&++unconf>MAX_OPEN) continue;   // cap on unconfirmed holds per buyer
        this.claims.set(String(oid),e);
        if(uid===this.uid) continue;
        const shop=S.shops.find(x=>x.id===Math.floor(+e.shopId)); if(!shop||!shop.mine) continue;     // only shops I own
        const cur=S.orders.find(x=>x.id===+oid);
        const es=['pending','review','cancelled'].includes(e.status)?e.status:'review';       // a buyer can never claim 'paid' or 'done': only the shop decides that
        if(!cur){
          if(es==='cancelled'||(es==='pending'&&Date.now()>+e.ts+PAY_WINDOW)) continue;
          const n=cleanOrderFn&&cleanOrderFn({...e,id:oid,code:'CDE-'+String(e.ch||'').slice(0,12).toUpperCase(),buyer:'remote',cloud:true,pin:'0000',dest:null,status:es});
          if(!n) continue; S.orders.unshift(n); ch=true;
          if(es==='review'){ pushNotice(shop,{type:'paid',kind:'item',name:'',n:n.qty}); Notify.now(loc(shop.name),t('alertPaid')); }
        } else if(cur.buyer==='remote'){
          if(RP.includes(e.rp)&&cur.rp!==e.rp){ cur.rp=e.rp; ch=true; }
          if(e.cl===1&&!cur.cl){ cur.cl=true; ch=true; }
          if(cur.status==='pending'&&es==='review'){ cur.status='review'; ch=true; pushNotice(shop,{type:'paid',kind:'item',name:'',n:cur.qty}); Notify.now(loc(shop.name),t('alertPaid')); }
          else if(cur.status==='pending'&&es==='cancelled'){ cur.status='cancelled'; ch=true; }
        }
      }
    }
    const st=applyStock(); if(ch||st) save(); queueRender();
  },
  ingestConfirms(){
    this.analyze(); let ch=false, msg='';
    S.orders.forEach(o=>{
      if(o.buyer!=='me'||!o.cloud||!['pending','review','paid'].includes(o.status)) return;
      const shop=S.shops.find(x=>x.id===o.shopId), c=shop&&shop.owner&&this.confirms[shop.owner]&&this.confirms[shop.owner][o.id];     // only the shop's owner may confirm
      if(!c||!['paid','done','cancelled'].includes(c.s)) return;
      if(c.s==='cancelled'){ if(o.status==='paid') return; }
      else if(rank(c.s)<=rank(o.status)) return;
      o.status=c.s; ch=true; msg=c.s==='done'?t('pickedUp'):c.s==='paid'?t('payConfirmedToast'):t('payRejectedToast');
      if(c.s==='done') awardBuyer(o); if(c.s==='cancelled') undoOrder(o);
    });
    if(ch){ save(); toast(msg); queueRender(); }
  }
};

ity, amount, the times of reservation / payment claim / confirmation / pickup, recipient name and last 4 digits of the receiving account) is kept for 12 months as evidence for payment disputes and fraud prevention. Your totals of food saved stay in your profile until you delete your account.</li>\n<li>Shop listings and payment-receiving details: until you delete the shop or your account.</li>\n<li>Rate-limit logs: 2 days. Photos: deleted from storage when the product is removed or expires (a nightly job runs at midnight Thailand time), or when you delete the shop.</li>\n<li>When you delete your account, your profile, shops, payment-receiving details and login are deleted, and your orders and transaction records are unlinked from you (the transaction record itself is kept for the period above). Provider backups expire on their normal schedule.</li>\n</ul>\n<h3>8. Your rights</h3>\n<p>Under the PDPA you may request access to and a copy of your data, data portability, correction, deletion, restriction or objection to processing, and withdraw consent. In the App, <b>Profile → My data</b> lets you download everything we hold about you and delete your account yourself. For other requests write to {{CONTACT}}; we reply within 30 days. You may also complain to the Personal Data Protection Committee (PDPC) of Thailand.</p>\n<h3>9. Security</h3>\n<p>Access to data is controlled on the server (not in the app), connections are encrypted, payment-receiving details are shown only to buyers who reserved from that shop, and pickup codes are generated by the server. If a data breach is likely to harm you, we will notify the PDPC within 72 hours of becoming aware and notify you without delay where required.</p>\n<h3>10. Children</h3>\n<p>The App is for people aged 20 or over. People under 20 may use it only with the consent of a parent or guardian. We do not knowingly collect data from children without such consent; contact us if you believe we have.</p>\n<h3>11. Cookies and storage</h3>\n<p>The web app uses only essential browser storage for your sign-in session and preferences. No tracking or advertising cookies are set by the web app.</p>\n<h3>12. Changes</h3>\n<p>We may update this policy. When the terms or this policy change materially, you will be asked to accept the new version before continuing to place or manage orders.</p>\n", "th": "\n<p class=\"muted\">เวอร์ชัน {{VERSION}} · ใช้กับเว็บแอปและแอปมือถือ CountDown Eats (\"แอป\")</p>\n<h3>1. ผู้ควบคุมข้อมูลส่วนบุคคล</h3>\n<p>{{OPERATOR}} (\"เรา\") เป็นผู้ให้บริการแอปและเป็นผู้ควบคุมข้อมูลส่วนบุคคลตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (\"PDPA\") ที่อยู่: {{ADDRESS}} ช่องทางติดต่อเรื่องข้อมูลส่วนบุคคล: {{CONTACT}}</p>\n<h3>2. ข้อมูลที่เราเก็บ</h3>\n<ul>\n<li><b>บัญชี:</b> เมื่อเข้าสู่ระบบด้วย Google เราได้รับรหัสบัญชี ชื่อ และอีเมลของคุณ เราไม่ได้รับรหัสผ่าน Google ของคุณ</li>\n<li><b>หากลงทะเบียนร้านค้า:</b> ชื่อร้าน ที่อยู่ ตำแหน่งบนแผนที่ เวลาขาย เมนู ราคา รูปภาพที่อัปโหลด และข้อมูลรับเงินที่คุณกรอก (เบอร์พร้อมเพย์หรือเลขบัญชี และชื่อบัญชี)</li>\n<li><b>คำสั่งซื้อ:</b> รายการที่จอง ยอดเงิน สถานะ (รอชำระ / ชำระแล้ว / รับของแล้ว / ยกเลิก) เวลา รหัสรับของ รายงานและคะแนนที่คุณส่ง</li>\n<li><b>ตำแหน่งที่ตั้ง:</b> ใช้ตำแหน่งจากโทรศัพท์เพื่อแสดงร้านใกล้เคียงและระยะทาง การคำนวณทำบนเครื่องของคุณ ส่วนการค้นหาร้านใกล้เคียงแอปส่งพิกัดโดยประมาณ (ปัดเศษประมาณ 1 กม.) ไปยังเซิร์ฟเวอร์เพื่อตอบคำขอนั้นเท่านั้น และเราไม่บันทึกพิกัดไว้ คุณปฏิเสธการเข้าถึงตำแหน่งและค้นหาด้วยชื่อร้านแทนได้</li>\n<li><b>ข้อมูลทางเทคนิค:</b> ที่อยู่ IP และบันทึกคำขอที่ผู้ให้บริการโฮสติ้งเก็บเพื่อความปลอดภัย และค่าตั้งต้น (ภาษา รัศมี) ที่เก็บในเครื่องคุณ</li>\n<li><b>โฆษณา (เฉพาะแอปมือถือ):</b> แอปมือถือแสดงโฆษณาจาก Google AdMob ซึ่งอาจใช้รหัสโฆษณาของอุปกรณ์ เว็บแอปไม่แสดงโฆษณา</li>\n</ul>\n<p>เราไม่เก็บเลขบัตรประชาชน เลขบัตรเครดิต หรือสลิปการโอนเงินของคุณ การชำระเงินทำโดยตรงระหว่างคุณกับร้านค้านอกแอป</p>\n<h3>3. วัตถุประสงค์และฐานทางกฎหมาย</h3>\n<ul>\n<li>เพื่อให้บริการ (บัญชี รายการสินค้า การจอง การยืนยันรับของ) – <i>เพื่อการปฏิบัติตามสัญญา</i></li>\n<li>เพื่อป้องกันการฉ้อโกงและการใช้งานที่ไม่เหมาะสม (จำกัดจำนวนการจองที่ค้างอยู่ ล็อกเมื่อไม่ชำระ ระงับร้านเมื่อมีรายงานที่ยืนยันแล้ว ระงับบัญชีที่ละเมิด) – <i>ประโยชน์โดยชอบด้วยกฎหมาย</i></li>\n<li>เพื่อแสดงร้านใกล้เคียงตามตำแหน่ง – <i>ความยินยอมของคุณ</i> (สิทธิ์ตำแหน่งในอุปกรณ์) ถอนได้ทุกเมื่อในการตั้งค่าอุปกรณ์</li>\n<li>เพื่อแสดงโฆษณาในแอปมือถือ – <i>ความยินยอมของคุณ</i> ในกรณีที่กฎหมายกำหนด</li>\n<li>เพื่อปฏิบัติตามกฎหมายและตอบคำขอที่ชอบด้วยกฎหมาย – <i>หน้าที่ตามกฎหมาย</i></li>\n</ul>\n<h3>4. การตัดสินใจอัตโนมัติ</h3>\n<p>มาตรการป้องกันบางอย่างทำงานอัตโนมัติด้วยกฎบนเซิร์ฟเวอร์ เช่น ผู้ซื้อที่แจ้งว่าโอนแล้วแต่ถูกร้านที่น่าเชื่อถือ 2 ร้านปฏิเสธภายใน 30 วัน อาจถูกจำกัดการจองใหม่ชั่วคราว ร้านที่ถูกผู้ซื้อ 3 ราย (คนละบัญชี) รายงานที่ยืนยันแล้วภายใน 30 วันจะถูกซ่อนจนกว่าจะตรวจสอบ หากเห็นว่าผิดพลาด ติดต่อเรา เจ้าหน้าที่จะตรวจสอบให้</p>\n<h3>5. ใครเห็นข้อมูลของคุณ</h3>\n<ul>\n<li><b>ร้านค้า</b> เห็นเพียงรหัสผู้ซื้อแบบนิรนาม รายการและยอดของคำสั่งซื้อ และสถานะ – ไม่เห็นชื่อ อีเมล หรือรหัส Google ของคุณ</li>\n<li><b>ผู้ซื้อ</b> ที่จองสินค้าจากร้านนั้นเห็นชื่อร้าน ที่อยู่ และข้อมูลรับเงินของร้าน</li>\n<li><b>ผู้ให้บริการ</b> ที่ช่วยให้แอปทำงาน: Supabase (ฐานข้อมูล การยืนยันตัวตน เก็บรูป) Google (เข้าสู่ระบบ AdMob) GitHub (โฮสต์เว็บไซต์) ประมวลผลตามคำสั่งของเราหรือตามข้อกำหนดของผู้ให้บริการ</li>\n<li><b>หน่วยงานรัฐ</b> เมื่อกฎหมายกำหนด เราไม่ขายข้อมูลส่วนบุคคล</li>\n</ul>\n<h3>6. การส่งข้อมูลไปต่างประเทศ</h3>\n<p>ฐานข้อมูลของเราตั้งอยู่ที่ {{REGION}} Google และ GitHub ก็ดำเนินงานนอกประเทศไทยเช่นกัน เราอาศัยมาตรการคุ้มครองตามสัญญาและมาตรการรักษาความปลอดภัยของผู้ให้บริการ และจะดูแลให้ประเทศปลายทางมีมาตรฐานคุ้มครองที่เพียงพอตาม PDPA เมื่อกฎหมายกำหนด</p>\n<h3>7. ระยะเวลาเก็บรักษา</h3>\n<ul>\n<li>รายละเอียดคำสั่งซื้อ (รหัสรับของ ข้อมูลบัญชีรับเงินที่คัดลอกไว้): 30 วันหลังคำสั่งซื้อสิ้นสุด ส่วนบันทึกธุรกรรมแบบย่อ (เลขที่ออเดอร์ ร้าน สินค้า จำนวน ยอดเงิน เวลาที่จอง/แจ้งโอน/ร้านยืนยัน/รับของ ชื่อผู้รับเงินและเลขท้าย 4 หลักของบัญชี) เก็บ 12 เดือน เพื่อเป็นหลักฐานเมื่อมีข้อพิพาทเรื่องการชำระเงินและเพื่อป้องกันการโกง ยอดสะสมอาหารที่ช่วยไว้เก็บในโปรไฟล์จนกว่าคุณจะลบบัญชี</li>\n<li>รายการสินค้าและข้อมูลรับเงินของร้าน: จนกว่าจะลบร้านหรือลบบัญชี</li>\n<li>บันทึกการจำกัดความถี่: 2 วัน รูปภาพ: ลบออกจากที่เก็บเมื่อสินค้าถูกลบหรือหมดอายุ (ระบบทำงานอัตโนมัติทุกเที่ยงคืนเวลาไทย) หรือเมื่อคุณลบร้าน</li>\n<li>เมื่อคุณลบบัญชี เราจะลบโปรไฟล์ ร้านค้า ข้อมูลรับเงิน และการเข้าสู่ระบบ ส่วนคำสั่งซื้อและบันทึกธุรกรรมจะถูกตัดการเชื่อมโยงกับคุณ (ตัวบันทึกธุรกรรมยังเก็บตามระยะเวลาข้างต้น) ข้อมูลสำรองของผู้ให้บริการจะหมดอายุตามรอบปกติ</li>\n</ul>\n<h3>8. สิทธิของคุณ</h3>\n<p>ตาม PDPA คุณมีสิทธิขอเข้าถึงและขอสำเนาข้อมูล ขอให้โอนย้ายข้อมูล แก้ไข ลบ ระงับ หรือคัดค้านการประมวลผล และถอนความยินยอม ในแอปเมนู <b>โปรไฟล์ → ข้อมูลของฉัน</b> คุณดาวน์โหลดข้อมูลทั้งหมดที่เราเก็บและลบบัญชีได้ด้วยตนเอง คำขออื่นส่งมาที่ {{CONTACT}} เราตอบภายใน 30 วัน และคุณร้องเรียนต่อคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) ได้</p>\n<h3>9. ความปลอดภัย</h3>\n<p>การเข้าถึงข้อมูลถูกควบคุมที่เซิร์ฟเวอร์ (ไม่ใช่ในแอป) การเชื่อมต่อเข้ารหัส ข้อมูลรับเงินแสดงเฉพาะผู้ซื้อที่จองจากร้านนั้น และรหัสรับของสร้างโดยเซิร์ฟเวอร์ หากเกิดเหตุละเมิดข้อมูลที่น่าจะกระทบสิทธิของคุณ เราจะแจ้ง สคส. ภายใน 72 ชั่วโมงนับแต่ทราบเหตุ และแจ้งคุณโดยไม่ชักช้าเมื่อกฎหมายกำหนด</p>\n<h3>10. เด็กและเยาวชน</h3>\n<p>แอปนี้สำหรับผู้มีอายุ 20 ปีขึ้นไป ผู้ที่อายุต่ำกว่า 20 ปีใช้ได้เมื่อได้รับความยินยอมจากผู้ปกครอง เราไม่เก็บข้อมูลของเด็กโดยรู้ตัวหากไม่มีความยินยอมดังกล่าว หากพบ โปรดแจ้งเรา</p>\n<h3>11. คุกกี้และพื้นที่จัดเก็บ</h3>\n<p>เว็บแอปใช้พื้นที่จัดเก็บของเบราว์เซอร์เท่าที่จำเป็นสำหรับการเข้าสู่ระบบและค่าที่ตั้งไว้ ไม่มีคุกกี้ติดตามหรือโฆษณาในเว็บแอป</p>\n<h3>12. การเปลี่ยนแปลง</h3>\n<p>เราอาจปรับปรุงนโยบายนี้ หากข้อกำหนดหรือนโยบายเปลี่ยนในสาระสำคัญ จะขอให้คุณยอมรับเวอร์ชันใหม่ก่อนใช้งานการจองหรือจัดการร้านต่อ</p>\n"}, "terms": {"en": "\n<p class=\"muted\">Version {{VERSION}}</p>\n<h3>1. Acceptance</h3>\n<p>By signing in or using the App you agree to these Terms and to the Privacy Policy. If you do not agree, do not use the App. You must be 20 or older, or have a parent's or guardian's consent.</p>\n<h3>2. What CountDown Eats is</h3>\n<p>CountDown Eats is a platform that lets shops list surplus or near-expiry food and other goods at a discount and lets buyers reserve them for pickup. <b>The sale is a contract between the buyer and the shop.</b> {{OPERATOR}} is not the seller, does not prepare, store, inspect or deliver goods, and does not receive or hold your money.</p>\n<h3>3. Accounts</h3>\n<p>Sign in with your own Google account. Keep it secure, give accurate information, and do not create multiple accounts to evade limits or bans. You are responsible for activity on your account.</p>\n<h3>4. Reservations, payment and pickup (buyers)</h3>\n<ul>\n<li>A reservation holds the item for <b>15 minutes</b> while you pay the shop directly (PromptPay QR or bank transfer) the exact amount shown, including the extra satang that identifies your order. Then press \"I have paid\".</li>\n<li>The shop confirms it received your transfer. Only after confirmation does your pickup QR / code become valid. Show it at the shop within the sale window.</li>\n<li>Unpaid reservations are cancelled automatically. Repeated unpaid reservations, or claiming payment that shops reject, can lead to temporary limits.</li>\n<li>Mystery boxes contain a mix of the types shown; exact items vary. Food listings are valid for the same day only.</li>\n<li>Refunds, exchanges and complaints are handled between you and the shop; you can also report a problem in the App.</li>\n</ul>\n<h3>5. Shops</h3>\n<ul>\n<li>You must be entitled to sell the goods and comply with Thai law (food safety, labelling, consumer protection, tax).</li>\n<li>Descriptions, prices, photos, expiry dates and sizes must be accurate. Cosmetics and supplements must show a valid registration number and make no medical or \"cure\" claims.</li>\n<li>Not allowed: illegal, counterfeit or stolen goods; goods past their use-by date; prescription or controlled medicines; alcohol, tobacco and e-cigarettes; weapons; adult content; live animals.</li>\n<li>Payment-receiving details must belong to you or your business. You must honour confirmed reservations and keep stock accurate. Do not put phone numbers, links or messaging IDs in listings.</li>\n<li>You must check your bank app before confirming a payment. Confirming a payment you did not receive is your own risk.</li>\n</ul>\n<h3>6. Prohibited conduct</h3>\n<p>Fraud; fake or edited payment slips; false reports or ratings; abusing or threatening others; bypassing or tampering with the App, its API or limits; scraping; uploading unlawful or infringing content; using the App to take people off the platform to scam them.</p>\n<h3>7. Safety measures</h3>\n<p>We use automatic and manual measures against fraud: limits on open reservations, unpaid-order lock, new-shop limits, hiding shops after confirmed reports, and banning accounts. We may suspend or remove accounts, listings or content that breach these Terms. You may ask us to review a decision at {{CONTACT}}.</p>\n<h3>8. Food safety and allergens</h3>\n<p>Shops are responsible for the safety, hygiene, labelling and allergen information of what they sell. Buyers should check the item at pickup and not consume anything that looks or smells spoiled. The App does not verify food safety.</p>\n<h3>9. Free service, ads, sponsors</h3>\n<p>The App is free for buyers and shops. We may fund it with advertising, sponsors or donations. Ads and sponsors are not endorsements by us of the advertised products.</p>\n<h3>10. Content</h3>\n<p>You keep ownership of photos and text you upload and give us a non-exclusive licence to display them in the App for as long as you keep them there. You confirm you have the right to upload them.</p>\n<h3>11. Disclaimer and limit of liability</h3>\n<p>The App is provided \"as is\" and may be unavailable or contain errors. To the maximum extent permitted by law, we are not liable for goods, their quality or safety, shops' or buyers' conduct, failed or disputed payments, or indirect losses. Nothing in these Terms excludes liability that cannot be excluded under Thai law (such as for intentional or grossly negligent acts) or limits your rights as a consumer.</p>\n<h3>12. Ending use</h3>\n<p>You may stop using the App and delete your account at any time (Profile → My data). Open paid orders must be completed or cancelled first. We may suspend or end access for breach of these Terms.</p>\n<h3>13. Changes</h3>\n<p>We may change these Terms. Material changes require your acceptance before you continue to reserve or manage orders.</p>\n<h3>14. Governing law</h3>\n<p>These Terms are governed by the laws of Thailand and the courts of Thailand have jurisdiction, without affecting your mandatory consumer rights.</p>\n<h3>15. Contact</h3>\n<p>{{OPERATOR}} · {{ADDRESS}} · {{CONTACT}}</p>\n", "th": "\n<p class=\"muted\">เวอร์ชัน {{VERSION}}</p>\n<h3>1. การยอมรับข้อตกลง</h3>\n<p>เมื่อเข้าสู่ระบบหรือใช้แอป ถือว่าคุณยอมรับข้อตกลงนี้และนโยบายความเป็นส่วนตัว หากไม่ยอมรับ โปรดอย่าใช้แอป ผู้ใช้ต้องมีอายุ 20 ปีขึ้นไป หรือได้รับความยินยอมจากผู้ปกครอง</p>\n<h3>2. CountDown Eats คืออะไร</h3>\n<p>CountDown Eats เป็นแพลตฟอร์มให้ร้านค้าลงขายอาหารและสินค้าเหลือหรือใกล้หมดอายุในราคาลดพิเศษ และให้ผู้ซื้อจองเพื่อไปรับเอง <b>การซื้อขายเป็นสัญญาระหว่างผู้ซื้อกับร้านค้า</b> {{OPERATOR}} ไม่ใช่ผู้ขาย ไม่ได้ปรุง เก็บ ตรวจ หรือจัดส่งสินค้า และไม่ได้รับหรือถือเงินของคุณ</p>\n<h3>3. บัญชีผู้ใช้</h3>\n<p>เข้าสู่ระบบด้วยบัญชี Google ของคุณเอง รักษาความปลอดภัยของบัญชี ให้ข้อมูลที่ถูกต้อง และไม่สร้างหลายบัญชีเพื่อเลี่ยงข้อจำกัดหรือการระงับ คุณรับผิดชอบต่อการใช้งานในบัญชีของคุณ</p>\n<h3>4. การจอง การชำระเงิน และการรับของ (ผู้ซื้อ)</h3>\n<ul>\n<li>การจองกันสินค้าไว้ให้ <b>15 นาที</b> ในช่วงนี้คุณต้องโอนเงินให้ร้านโดยตรง (พร้อมเพย์คิวอาร์หรือโอนบัญชี) ตามยอดที่แสดง รวมเศษสตางค์ที่ใช้ระบุคำสั่งซื้อของคุณ แล้วกด \"โอนแล้ว\"</li>\n<li>ร้านจะยืนยันว่าได้รับเงิน เมื่อยืนยันแล้วคิวอาร์/รหัสรับของจึงใช้ได้ แสดงที่ร้านภายในเวลาขาย</li>\n<li>การจองที่ไม่ชำระจะถูกยกเลิกอัตโนมัติ การจองแล้วไม่ชำระซ้ำ ๆ หรือแจ้งว่าโอนแต่ร้านปฏิเสธ อาจถูกจำกัดการใช้งานชั่วคราว</li>\n<li>กล่องสุ่มมีสินค้าตามประเภทที่ระบุ รายการจริงอาจต่างกัน รายการอาหารใช้ได้ภายในวันนั้นเท่านั้น</li>\n<li>การคืนเงิน เปลี่ยนสินค้า และข้อร้องเรียน ให้ตกลงกับร้านค้า และคุณรายงานปัญหาในแอปได้</li>\n</ul>\n<h3>5. ร้านค้า</h3>\n<ul>\n<li>ต้องมีสิทธิขายสินค้าและปฏิบัติตามกฎหมายไทย (ความปลอดภัยอาหาร ฉลาก คุ้มครองผู้บริโภค ภาษี)</li>\n<li>คำอธิบาย ราคา รูป วันหมดอายุ และขนาด ต้องถูกต้อง เครื่องสำอางและอาหารเสริมต้องแสดงเลขทะเบียนที่ถูกต้อง และห้ามอวดอ้างสรรพคุณทางการแพทย์หรือ \"รักษาโรค\"</li>\n<li>ห้ามขาย: สินค้าผิดกฎหมาย ปลอม หรือได้มาโดยมิชอบ สินค้าที่เลยวันหมดอายุ ยาที่ต้องสั่งโดยแพทย์หรือยาควบคุม แอลกอฮอล์ บุหรี่และบุหรี่ไฟฟ้า อาวุธ สื่อลามก สัตว์มีชีวิต</li>\n<li>ข้อมูลรับเงินต้องเป็นของคุณหรือกิจการของคุณ ต้องรักษาการจองที่ยืนยันแล้วและอัปเดตสต็อกให้ตรง ห้ามใส่เบอร์โทร ลิงก์ หรือไอดีแชตในรายการสินค้า</li>\n<li>ต้องตรวจสอบแอปธนาคารก่อนกดยืนยันว่าได้รับเงิน การยืนยันทั้งที่ไม่ได้รับเงินเป็นความเสี่ยงของร้านเอง</li>\n</ul>\n<h3>6. พฤติกรรมที่ห้าม</h3>\n<p>การฉ้อโกง สลิปปลอมหรือตัดต่อ รายงานหรือคะแนนเท็จ การข่มขู่หรือล่วงละเมิดผู้อื่น การหลบเลี่ยงหรือแก้ไขแอป API หรือข้อจำกัดของระบบ การดึงข้อมูลอัตโนมัติ การอัปโหลดเนื้อหาผิดกฎหมายหรือละเมิดสิทธิ์ และการใช้แอปเพื่อชักชวนผู้อื่นออกนอกระบบไปหลอกลวง</p>\n<h3>7. มาตรการความปลอดภัย</h3>\n<p>เราใช้มาตรการทั้งอัตโนมัติและโดยเจ้าหน้าที่ป้องกันการโกง ได้แก่ จำกัดจำนวนการจองที่ค้างอยู่ ล็อกเมื่อไม่ชำระ จำกัดร้านใหม่ ซ่อนร้านหลังมีรายงานที่ยืนยันแล้ว และระงับบัญชี เราอาจระงับหรือลบบัญชี รายการ หรือเนื้อหาที่ฝ่าฝืนข้อตกลงนี้ คุณขอให้ทบทวนการตัดสินใจได้ที่ {{CONTACT}}</p>\n<h3>8. ความปลอดภัยของอาหารและสารก่อภูมิแพ้</h3>\n<p>ร้านค้าเป็นผู้รับผิดชอบความปลอดภัย สุขอนามัย ฉลาก และข้อมูลสารก่อภูมิแพ้ของสินค้าที่ขาย ผู้ซื้อควรตรวจสินค้าตอนรับและไม่บริโภคสิ่งที่เสียหรือมีกลิ่นผิดปกติ แอปไม่ได้ตรวจสอบความปลอดภัยของอาหาร</p>\n<h3>9. บริการฟรี โฆษณา และผู้สนับสนุน</h3>\n<p>แอปใช้ฟรีสำหรับผู้ซื้อและร้านค้า เราอาจหารายได้จากโฆษณา ผู้สนับสนุน หรือเงินบริจาค โฆษณาและผู้สนับสนุนไม่ถือเป็นการรับรองสินค้านั้นโดยเรา</p>\n<h3>10. เนื้อหา</h3>\n<p>คุณยังเป็นเจ้าของรูปและข้อความที่อัปโหลด และอนุญาตให้เราแสดงในแอปแบบไม่ผูกขาดตราบที่คุณยังคงไว้ คุณรับรองว่ามีสิทธิอัปโหลดเนื้อหานั้น</p>\n<h3>11. การปฏิเสธและจำกัดความรับผิด</h3>\n<p>แอปให้บริการ \"ตามสภาพ\" อาจใช้งานไม่ได้หรือมีข้อผิดพลาด ภายในขอบเขตสูงสุดที่กฎหมายอนุญาต เราไม่รับผิดชอบต่อสินค้า คุณภาพหรือความปลอดภัยของสินค้า พฤติกรรมของร้านค้าหรือผู้ซื้อ การชำระเงินที่ล้มเหลวหรือเป็นข้อพิพาท หรือความเสียหายทางอ้อม ข้อตกลงนี้ไม่ได้ยกเว้นความรับผิดที่กฎหมายไทยไม่ให้ยกเว้น (เช่น การกระทำโดยเจตนาหรือประมาทเลินเล่ออย่างร้ายแรง) และไม่จำกัดสิทธิของคุณในฐานะผู้บริโภค</p>\n<h3>12. การเลิกใช้งาน</h3>\n<p>คุณเลิกใช้และลบบัญชีได้ทุกเมื่อ (โปรไฟล์ → ข้อมูลของฉัน) โดยต้องดำเนินการคำสั่งซื้อที่ชำระแล้วและยังค้างอยู่ให้เสร็จหรือยกเลิกก่อน เราอาจระงับหรือยุติการเข้าถึงหากฝ่าฝืนข้อตกลง</p>\n<h3>13. การเปลี่ยนแปลง</h3>\n<p>เราอาจแก้ไขข้อตกลงนี้ หากเปลี่ยนในสาระสำคัญ จะขอให้คุณยอมรับก่อนใช้งานการจองหรือจัดการคำสั่งซื้อต่อ</p>\n<h3>14. กฎหมายที่ใช้บังคับ</h3>\n<p>ข้อตกลงนี้อยู่ภายใต้กฎหมายไทย และศาลไทยมีเขตอำนาจ โดยไม่กระทบสิทธิของผู้บริโภคตามกฎหมาย</p>\n<h3>15. ติดต่อ</h3>\n<p>{{OPERATOR}} · {{ADDRESS}} · {{CONTACT}}</p>\n"}};

const SRV_ERR={AUTH:'errAuth',LOGIN:'errLogin',BANNED:'errBanned',RATE:'errRate',BAD_INPUT:'errBadInput',SELF:'ownShop',CLOSED:'closedToast',SUSPENDED:'shopSuspended',NO_PAY:'payNotSet',ENDED:'listingEnded',SOLD_OUT:'soldOutToast',
  STOCK_LEFT:'stockLeft',ACCT_LIMITED:'acctLimited',TOO_MANY_OPEN:'tooManyOpen',UNPAID_LOCK:'unpaidLock',NEW_SHOP_CAP:'newShopCap',NEW_SHOP_BUSY:'newShopBusy',SHOP_NO_CREDIT:'shopNoCredit',WALLET_TERMS:'walletTermsNeed',SHOP_BUSY:'newShopBusy',NOT_FOUND:'errNotFound',STATE:'errState',
  EXPIRED_ORDER:'orderExpired',BAD_CODE:'scanBadCode',NOT_PAID:'notPaidYet',USED:'scanUsed',TOO_MANY_SHOPS:'maxShops',TOO_MANY_ITEMS:'maxItemsToast',BAD_ITEM:'errBadItem',BAD_FDA:'errBadItem',BAD_TEXT:'noContactInName',BAD_PAY:'payNeed'};
const Srv={
  on:false,since:null,sold:{},hash:{},others:new Map(),mineList:[],known:new Map(),stats:null,dirty:false,pushing:false,again:false,pushT:0,pollT:0,lastFull:0,creating:false,idsSig:'',ordSig:'',
  async init(){
    try{
      const cfg=window.CDE_SUPABASE; if(!(cfg&&cfg.url&&cfg.key)) return;
      if(!window.supabase){ await new Promise((ok,no)=>{ const e=document.createElement('script'); e.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; e.onload=ok; e.onerror=no; document.head.appendChild(e); }); }
      const em=/[?&#]error_description=([^&]+)/.exec(location.search+location.hash);                  // show why a social login came back with an error
      if(em&&!/identity_already_exists|Identity.*already/i.test(decodeURIComponent(location.search+location.hash))){ try{ const msg=decodeURIComponent(em[1].replace(/\+/g,' ')).slice(0,140); setTimeout(()=>{ toast(t('loginFail')+' — '+msg); },1200); history.replaceState(null,'',location.pathname); }catch(e){} }
      const already=/identity_already_exists/.test(location.search+location.hash);       // this Google account already belongs to an older user: sign in as that user instead of linking
      if(already){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
      const cl=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      let ses=(await cl.auth.getSession()).data.session;
      if(!ses){ const r=await cl.auth.signInAnonymously(); if(r.error||!r.data||!r.data.session) throw (r.error||new Error('auth')); ses=r.data.session; }
      Cloud.sb=cl; Cloud.sbUser=ses.user; Cloud.uid=String(ses.user.id); this.on=true;
      if(already&&ses.user.is_anonymous){
        let tried=false; try{ tried=sessionStorage.getItem('cde-relogin')==='1'; sessionStorage.setItem('cde-relogin','1'); }catch(e){}
        if(!tried){ toast(t('reloginExisting')); const r=await cl.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}); if(!(r&&r.error)) return; }
        else toast(t('loginFail'));
      }
      if(!ses.user.is_anonymous){ try{ sessionStorage.removeItem('cde-relogin'); }catch(e){} }
      syncAuth(ses.user); await this.consentAfterLogin();
      await this.refresh(true); this.loop(); queueRender();
    }catch(e){ this.on=false; queueRender(); }
  },
  async rpc(fn,args){
    const r=await Promise.race([Cloud.sb.rpc(fn,args||{}),new Promise((_,rej)=>setTimeout(()=>rej({code:'NET',n:0,timeout:true}),20000))]);   // never hang silently
    if(r.error){ const m=/CDE_ERR:([A-Z_]+):(-?\d+)/.exec(r.error.message||''); throw {code:m?m[1]:'NET',n:m?+m[2]:0}; }

  err(e){

/* ---------- Discounts, shop location, sharing, search ---------- */
const pct=(w,p)=>(w>p&&p>=0)?Math.round((1-p/w)*100):0;
const pctBadge=(w,p)=>pct(w,p)>0?`<span class="text-xs font-bold px-1.5 py-0.5 rounded-full text-white" style="background:var(--chili)">${t('offPct',{n:pct(w,p)})}</span>`:'';
const priceHtml=(p,w,sz)=>`${w>p?`<span class="text-xs muted line-through">฿${w}</span> `:''}<span class="display ${sz}">฿${p}</span>${w>p?' '+pctBadge(w,p):''}`;
const validLL=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0);
/* Google Maps URLs (documented link format): search = pin, dir = turn-by-turn. No API key, nothing loaded in the app. */
function mapUrl(sh,dir){
  const base=dir?'https://www.google.com/maps/dir/?api=1&destination=':'https://www.google.com/maps/search/?api=1&query=';
  if(validLL(sh.lat,sh.lng)) return base+sh.lat+','+sh.lng;
  const q=[loc(sh.name),sh.addr].filter(Boolean).join(' ').slice(0,200); return q?base+encodeURIComponent(q):'';
}
function mapLinks(sh){
  const u=mapUrl(sh), d=mapUrl(sh,true); if(!u) return '';
  return `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener noreferrer">📍 ${t('viewMap')}</a><a class="chip" href="${esc(d)}" target="_blank" rel="noopener noreferrer">🧭 ${t('navTo')}</a>`;
}
function getPos(ok){
  if(!navigator.geolocation) return toast(t('locFail'));
  navigator.geolocation.getCurrentPosition(p=>ok(Math.round(p.coords.latitude*1e5)/1e5,Math.round(p.coords.longitude*1e5)/1e5),()=>toast(t('locFail')),{enableHighAccuracy:true,timeout:10000});
}
async function doShare(title,text,url){
  url=url||baseUrl(); const full=text+'\n'+url;                                  // always include the app link so friends can open it
  try{ if(navigator.share&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){ await navigator.share({title,text:full}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const u=encodeURIComponent(url);
  sheet(`<div class="display text-xl mb-3">${t('shareTitle')}</div>
    <div class="grid grid-cols-1 gap-2">
      <a class="btn jade text-center" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?${encodeURIComponent(full)}">LINE</a>
      <a class="btn text-center" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}&quote=${encodeURIComponent(text)}">Facebook / Messenger</a>
      <button class="btn alt" onclick="copyShare(decodeURIComponent('${encodeURIComponent(full)}'))">${t('shareCopy')}</button>
    </div><pre class="text-xs muted mt-3" style="white-space:pre-wrap;word-break:break-word">${esc(full)}</pre>`);
}
function copyShare(text){
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); toast(t('shareCopied')); };
  try{ navigator.clipboard.writeText(text).then(()=>toast(t('shareCopied')),fb); }catch(e){ fb(); }
}
function placeLines(sh){ return [sh.addr?'📍 '+sh.addr:'',validLL(sh.lat,sh.lng)?mapUrl(sh):''].filter(Boolean); }   // no long search URL when the shop has no coordinates
function offerLine(sh,o){ return o.worth>o.price?t('shareDisc',{name:offerTitle(o),shop:loc(sh.name),price:o.price,worth:o.worth,pct:pct(o.worth,o.price)}):t('sharePlain',{name:offerTitle(o),shop:loc(sh.name),price:o.price}); }
function shareShop(id){
  const sh=S.shops.find(x=>x.id===id); if(!sh) return;
  const lines=[ (sh.emoji||'')+' '+loc(sh.name), ...liveOffers(sh).filter(o=>o.left>0).slice(0,4).map(o=>'• '+offerLine(sh,o)), ...placeLines(sh) ];
  doShare(loc(sh.name),lines.join('\n'),baseUrl()+'?shop='+sh.id);
}
function shareOffer(sid,kind,id){
  const sh=S.shops.find(x=>x.id===sid), o=sh&&offerOf(sh,kind,id); if(!o) return;
  doShare(offerTitle(o),[offerLine(sh,o),...placeLines(sh)].join('\n'),baseUrl()+'?shop='+sh.id);
}
function shareOrder(id){
  const o=S.orders.find(x=>x.id===id&&x.buyer==='me'); if(!o) return;
  const sh=S.shops.find(x=>x.id===o.shopId)||{name:o.name};

const allText=x=>typeof x==='string'?x:(x&&typeof x==='object'?Object.values(x).join(' '):'');
function shopHay(sh){ const p=[allText(sh.name),sh.addr||'',t('type_'+sh.type),sh.chain?chainName(sh.chain)+' '+(CHAIN_KW[sh.chain]||''):'']; (sh.items||[]).forEach(m=>p.push(allText(m.name))); (sh.bundles||[]).forEach(b=>p.push(b.name||'')); return normQ(p.join(' ')); }

}

/* ---------- Real distance from the buyer's GPS (kept on this device only) ---------- */
const DEMO_LOC={lat:13.74,lng:100.53};                                   // near the demo shops (demo build only)
function kmBetween(a,b,c,d){ const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(h))); }
const hasMe=()=>!!(S.myLoc&&validLL(S.myLoc.lat,S.myLoc.lng));
const hasCoords=sh=>validLL(sh.lat,sh.lng);
const distKm=sh=>(hasMe()&&hasCoords(sh))?kmBetween(S.myLoc.lat,S.myLoc.lng,sh.lat,sh.lng):null;
function distLabel(sh){ const d=distKm(sh); if(d!=null) return (d<10?d.toFixed(1):Math.round(d))+' '+t('km'); return hasMe()?t('distUnknown'):sh.dist+' '+t('km'); }
const withinRadius=sh=>{ const d=distKm(sh); if(d!=null) return d<=S.radius; return hasMe()?true:sh.dist<=S.radius; };   // unknown coordinates are kept, never silently hidden
const byDistance=(a,b)=>{ const x=distKm(a),y=distKm(b); return (x==null?1e9:x)-(y==null?1e9:y); };
function useMyLocation(){ getPos((a,b)=>{ S.myLoc={lat:a,lng:b,ts:Date.now()}; save(); toast(t('locUpdated')); render(); if(PROD&&Srv.on) Srv.pullShops(true); }); }
function useDemoLocation(){ S.myLoc={lat:DEMO_LOC.lat,lng:DEMO_LOC.lng,ts:Date.now()}; save(); render(); }
function clearMyLocation(){ S.myLoc=null; save(); render(); }
function gpsBar(){

  return `<div class="flex flex-wrap gap-2 mb-1"><button class="chip on" onclick="useMyLocation()">📍 ${t('useGps')}</button>${DEMO_MODE?`<button class="chip" onclick="useDemoLocation()">${t('gpsDemo')}</button>`:''}</div>`;
}

/* A listing is: live -> soldout (shown as SOLD OUT for a short grace) -> cleared (hidden). Food also ends at the day cut-off. */
const SOLD_GRACE=10*60000;
const isFoodCat=c=>FOOD_CATS.includes(c);
const graceState=(left,soldAt)=>left>0?'live':((soldAt&&Date.now()-soldAt>SOLD_GRACE)?'cleared':'soldout');
function itemState(sh,x){ const today=bkkISO(); if(x.exp&&x.exp<today) return 'expired'; if(isFoodCat(x.cat)&&x.d!==today) return 'stale'; return graceState(x.left,x.soldAt); }
function boxState(sh,st){ const food=CATS.some(k=>isFoodCat(k)&&(+st.mix[k]||0)>0); if(food&&st.d!==bkkISO()) return 'stale'; return graceState(st.left,st.soldAt); }
function bundleState(sh,b){
  const its=b.itemIds.map(i=>(sh.items||[]).find(x=>x.id===i)).filter(Boolean);
  if(its.length<MIN_DISH) return 'invalid';
  const today=bkkISO();
  if(its.some(x=>x.exp&&x.exp<today)) return 'expired';
  if(its.some(x=>isFoodCat(x.cat))&&b.d!==today) return 'stale';
  return graceState(b.left,b.soldAt);
}
const VISIBLE=['live','soldout'];
function stateOf(sh,kind,id){
  if(kind==='item'){ const x=(sh.items||[]).find(y=>y.id===id); return x?itemState(sh,x):''; }
  if(kind==='bundle'){ const b=(sh.bundles||[]).find(y=>y.id===id); return b?bundleState(sh,b):''; }
  const st=(sh.sets||[]).find(y=>y.id===id); return st?boxState(sh,st):'';
}
const liveItems=sh=>(sh.items||[]).filter(x=>VISIBLE.includes(itemState(sh,x)));
const shopOpen=sh=>!suspended(sh)&&sh.endAt>Date.now()&&(!isTimed(sh)||flashOn());

/* ----- offers: a normalized view of mystery boxes, shop sets and single items ----- */
function offerOf(sh,kind,id){
  if(kind==='item'){ const it=(sh.items||[]).find(x=>x.id===id); return it?{kind,id,price:it.price,worth:it.worth>it.price?it.worth:it.price,left:it.left,n:1,item:it,state:itemState(sh,it)}:null; }
  if(kind==='bundle'){
    const b=(sh.bundles||[]).find(x=>x.id===id); if(!b) return null;
    const its=b.itemIds.map(i=>(sh.items||[]).find(x=>x.id===i)).filter(Boolean); if(its.length<2) return null;
    return {kind,id,price:b.price,worth:its.reduce((a,x)=>a+(x.worth>x.price?x.worth:x.price),0),left:b.left,n:its.length,bundle:b,items:its,state:bundleState(sh,b)};
  }
  const st=(sh.sets||[]).find(x=>x.id===id); return st?{kind:'box',id,price:st.price,worth:st.worth,left:st.left,n:setN(st),box:st,state:boxState(sh,st)}:null;
}
const offerExpired=o=>o.state==='expired';
function liveOffers(sh){
  const out=[];
  (sh.sets||[]).forEach(st=>{ const o=offerOf(sh,'box',st.id); if(o&&VISIBLE.includes(o.state)) out.push(o); });
  (sh.bundles||[]).forEach(b=>{ const o=offerOf(sh,'bundle',b.id); if(o&&VISIBLE.includes(o.state)) out.push(o); });
  liveItems(sh).forEach(x=>{ const o=offerOf(sh,'item',x.id); if(o) out.push(o); });
  return out;
}
const leftOf=sh=>liveOffers(sh).reduce((a,o)=>a+o.left,0);

  S.notices.unshift({id:Date.now()*1000+crypto.getRandomValues(new Uint16Array(1))[0]%1000,ts:Date.now(),shopId:sh.id,...x}); S.notices=S.notices.slice(0,30);
}

function takeStock(sh,o,qty){                                              // returns true when this purchase sold the last unit
  const r=o.kind==='item'?o.item:o.kind==='bundle'?o.bundle:o.box;
  r.left=Math.max(0,r.left-qty);
  if(r.left>0) return false;
  r.soldAt=Date.now();
  pushNotice(sh,{type:'soldout',kind:o.kind,name:o.kind==='item'?o.item.name:(o.kind==='bundle'?(o.bundle.name||''):''),n:o.n});
  return true;
}
function itemMeta(m){
  const b=[]; if(m.price>0) b.push('฿'+(+m.price)); if(CATS.includes(m.cat)) b.push(t('cat_'+m.cat)); if(m.size) b.push(t('sizeLabel')+' '+m.size);
  return b.join(' · ');
}
function offerTitle(o){
  if(o.kind==='item') return loc(o.item.name);
  if(o.kind==='bundle') return o.bundle.name||t('setN',{n:o.n});
  return `${t('boxN',{n:o.n})} · ${mixText(o.box.mix)}`;
}
function orderTitle(o){

  if(o.kind==='bundle') return (o.bundleName||t('setN',{n:o.n}))+q;
  return `${t('boxN',{n:o.n})}${o.mix?' · '+mixText(o.mix):''}`;
}

function readDish(type){

  if(qty<1||qty>999){ toast(t('errItemQty')); return null; }
  let exp='',fda='',size='';

function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(f); }); }
async function compressImage(file){
  const src=await readFile(file);
  const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=src; });
  let out='';
  for(const [side,q] of [[640,.7],[520,.55],[420,.45]]){                 // re-encode as JPEG: shrinks size and strips EXIF/GPS
    const k=Math.min(1,side/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q); if(out.length<=110000) break;
  }
  return out;
}
async function onPickPhoto(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp|gif|heic|heif)$/i.test(f.type)) return toast(t('badImage'));   // no SVG uploads
  if(f.size>10*1024*1024) return toast(t('tooBig'));
  try{ const img=await compressImage(f); if(!safeImg(img)) throw new Error('bad'); window._pending=img;
    $('#pv').innerHTML=`<img src="${safeImg(img)}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px">`; }
  catch(e){ window._pending=null; toast(t('badImage')); }
}

/* ----- bundle (shop-composed set) editor ----- */
let WB=[], WI=[], WS=[], WT='eatery';
const newBundle=()=>({id:'g'+Math.random().toString(36).slice(2,7),name:'',itemIds:[],price:0,qty:3});
const sumOf=(ids,f)=>ids.map(i=>WI.find(x=>x.id===i)).filter(Boolean).reduce((a,x)=>a+f(x),0);
function bundleRowHtml(b,i){
  const n=b.itemIds.filter(id=>WI.some(x=>x.id===id)).length, sumP=sumOf(b.itemIds,x=>x.price), sumW=sumOf(b.itemIds,x=>x.worth>x.price?x.worth:x.price);
  return `<div class="card p-3 mb-2">
    <div class="flex justify-between items-center gap-2"><b>${n?t('setN',{n}):t('sectionSets')}</b>${rowBadge('bundle',b.id)}<button class="chip" onclick="rmBundle(${i})">${t('delete')}</button></div>
    <label class="text-xs font-semibold block mt-2">${t('bundleName')}<input maxlength="30" value="${esc(b.name||'')}" oninput="bField(${i},'name',this.value)"></label>
    <div class="text-xs font-semibold mt-2">${t('pickItems')}</div>
    <div class="flex flex-wrap gap-2 my-2">${WI.map(x=>`<button class="chip ${b.itemIds.includes(x.id)?'on':''}" style="padding:4px 10px" aria-pressed="${b.itemIds.includes(x.id)}" onclick="bToggle(${i},'${x.id}')">${esc(loc(x.name))} ฿${x.price}</button>`).join('')}</div>
    <div class="text-xs muted">${t('listValue',{n:sumW})}${sumP!==sumW?` · ฿${sumP}`:''}</div>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <label class="text-xs font-semibold">${t('setPrice')}<input type="number" inputmode="numeric" min="1" max="9999" value="${b.price||''}" oninput="bField(${i},'price',this.value)"></label>
      <label class="text-xs font-semibold">${t('setQty')}<input type="number" inputmode="numeric" min="1" max="99" value="${b.qty}" oninput="bField(${i},'qty',this.value)"></label>
    </div></div>`;
}
function bundlesEditorHtml(){
  if(WI.length<2) return `<div class="card p-3 text-sm muted">${t('needItemsForSet')}</div>`;
  return WB.map(bundleRowHtml).join('')+(WB.length<MAX_BUNDLES?`<button class="btn ghost w-full" onclick="addBundle()">+ ${t('addBundle')}</button>`:'')+`<div class="text-xs muted mt-2">${t('stockSep')}</div>`;
}
function redrawBundles(){ const b=$('#bundles'); if(b) b.innerHTML=bundlesEditorHtml(); }
function addBundle(){ if(WB.length>=MAX_BUNDLES) return toast(t('maxSets',{n:MAX_BUNDLES})); WB.push(newBundle()); redrawBundles(); }
function rmBundle(i){ WB.splice(i,1); redrawBundles(); }
function bField(i,k,v){ if(!WB[i]) return; if(k==='name') WB[i].name=String(v).slice(0,30); else WB[i][k]=Math.max(0,Math.min(9999,Math.floor(+v||0))); }
function bToggle(i,id){
  const b=WB[i]; if(!b) return; const j=b.itemIds.indexOf(id);
  if(j>=0) b.itemIds.splice(j,1); else if(b.itemIds.length>=MAX_DISH) return toast(t('maxDishes',{n:MAX_DISH})); else b.itemIds.push(id);
  const sumP=sumOf(b.itemIds,x=>x.price); if(b.itemIds.length&&(!b.price||b.price>sumP)) b.price=Math.max(1,Math.round(sumP*0.85));
  redrawBundles();
}
function validBundles(){
  for(const b of WB){
    if(hasContact(b.name)) return 'noContactInName';
    const ids=b.itemIds.filter(id=>WI.some(x=>x.id===id)), sumP=sumOf(ids,x=>x.price);
    if(ids.length<MIN_DISH||ids.length>MAX_DISH) return 'errBundleItems';
    if(!(b.price>=1)||b.price>sumP) return 'errBundlePrice';
    if(!(b.qty>=1&&b.qty<=99)) return 'errSetQty';
  }
  return '';
}
function cleanBundles(list,items){ return list.map(b=>({id:b.id,name:String(b.name||'').trim().slice(0,30),itemIds:b.itemIds.filter(id=>items.some(x=>x.id===id)),price:b.price,qty:b.qty,left:b.qty,d:bkkISO(),soldAt:0,ep:Date.now(),auto:b.auto===true})); }
function reconcileBundles(sh){                                              // after an item is edited or deleted
  let removed=0;
  sh.bundles=(sh.bundles||[]).map(b=>{ const ids=b.itemIds.filter(id=>sh.items.some(x=>x.id===id)); const sumP=ids.reduce((a,id)=>a+sh.items.find(x=>x.id===id).price,0); return {...b,itemIds:ids,price:Math.min(b.price,sumP)}; })
    .filter(b=>{ const ok=b.itemIds.length>=MIN_DISH&&b.price>=1; if(!ok) removed++; return ok; });
  return removed;
}

/* ----- shop mode: manage a verified shop's items, sets and boxes ----- */

let MG={sid:0,tab:'items'};
function relistables(sh){
  const L=[];
  (sh.items||[]).forEach(x=>{ if(['stale','cleared','soldout'].includes(itemState(sh,x))&&x.qty>0) L.push(['item',x]); });
  (sh.bundles||[]).forEach(b=>{ if(['stale','cleared','soldout'].includes(bundleState(sh,b))&&b.qty>0) L.push(['bundle',b]); });
  (sh.sets||[]).forEach(st=>{ if(['stale','cleared','soldout'].includes(boxState(sh,st))&&st.qty>0) L.push(['box',st]); });
  return L;
}

        <div class="flex flex-wrap gap-2 mt-2"><label class="chip" style="cursor:pointer">🖼️ ${t('newPhotoBtn')}<input type="file" accept="image/*" onchange="changePhoto(${sh.id},'${m.id}',this)" style="position:absolute;opacity:0;width:1px;height:1px"></label>${m.img&&m.img!==PH_IMG?`<button class="chip" onclick="removePhoto(${sh.id},'${m.id}')">❌ ${t('delPhotoBtn')}</button>`:`<span class="text-xs muted self-center">${t('noPhotoYet')}</span>`}</div>

function ownedShop(sid){ const sh=S.shops.find(x=>x.id===sid); return editable(sh)?sh:null; }
function commit(){ if(PROD){ Srv.dirty=true; save(); Srv.push(); return true; } if(save()) return true; toast(t('saveNeeded')); return false; }
function relistToday(sid){                                                  // one tap: put yesterday's / sold-out listings back on sale with their usual stock
  const sh=ownedShop(sid); if(!sh) return toast(t('notEditable'));
  const L=relistables(sh); if(!L.length) return toast(t('relistNone'));
  const today=bkkISO(); L.forEach(([k,r])=>{ r.left=r.qty; r.d=today; r.soldAt=0; r.ep=Date.now(); });
  if(!commit()) return; toast(t('relisted',{n:L.length})); render(); if(MG.sid===sid&&MGON&&$('#msh')) openMenuMgr(sid,MG.tab);

function addItem(sid){
  const sh=ownedShop(sid); if(!sh) return toast(t('notEditable'));
  if(sh.items.length>=MAX_ITEMS) return toast(t('maxItemsToast',{n:MAX_ITEMS}));
  const d=readDish(sh.type); if(!d) return;
  d.ep=Date.now(); sh.items.push(d);

function itemEdit(sid,iid,field,val){
  const sh=ownedShop(sid); if(!sh) return toast(t('notEditable'));
  const m=sh.items.find(x=>x.id===iid); if(!m) return;
  const v=Math.floor(+val||0), prev={price:m.price,worth:m.worth,qty:m.qty,left:m.left,d:m.d,soldAt:m.soldAt};
  if(field==='price'){ if(v<1||v>9999||(m.worth&&m.worth<v)){ toast(t('errItemPrice')); return openMenuMgr(sid,'items'); } m.price=v; }
  else if(field==='worth'){ if(v&&(v<m.price||v>99999)){ toast(t('errItemPrice')); return openMenuMgr(sid,'items'); } m.worth=v; }
  else if(field==='qty'){ if(v<0||v>999){ toast(t('errItemQty')); return openMenuMgr(sid,'items'); } m.qty=v; m.left=v; m.ep=Date.now(); if(v>0){ m.d=bkkISO(); m.soldAt=0; } else { m.soldAt=Date.now(); pushNotice(sh,{type:'soldout',kind:'item',name:m.name,n:1}); } }
  const removed=reconcileBundles(sh);
  if(!commit()){ Object.assign(m,prev); return; }
  toast(removed?t('delBundleWarn'):t('itemSaved')); render();
}

const cleanAddr=v=>String(v==null?'':v).replace(/[\u0000-\u001f<>]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
const autoOf=sh=>editable(sh)?relistables(sh).filter(([k,r])=>r.auto===true):[];
const dueShops=()=>mgrShops().filter(sh=>autoOf(sh).some(([k,r])=>r.d!==bkkISO()));   // banner only for listings from earlier days (no nagging after a same-day sell-out)

function confirmDailyMenu(sid){
  const sh=ownedShop(sid); if(!sh) return toast(t('notEditable'));
  const picks=[];
  for(const [k,r] of autoOf(sh)){
    const c=document.getElementById('dmc_'+k+'_'+r.id), q=document.getElementById('dmq_'+k+'_'+r.id);
    if(!c||!c.checked) continue;
    const v=Math.floor(+(q&&q.value)||0);
    if(v<1||v>(k==='item'?999:99)) return toast(t('errItemQty'));
    picks.push([r,v]);
  }
  if(!picks.length) return toast(t('dmNone'));
  const today=bkkISO(), prev=picks.map(([r])=>({qty:r.qty,left:r.left,d:r.d,soldAt:r.soldAt}));
  picks.forEach(([r,v])=>{ r.qty=v; r.left=v; r.d=today; r.soldAt=0; r.ep=Date.now(); });
  if(!commit()){ picks.forEach(([r],i)=>Object.assign(r,prev[i])); return; }
  S.notices=S.notices.filter(x=>!(x.shopId===sid&&x.type==='daycut')); save();
  toast(t('dmOpened',{n:picks.length})); closeSheet(); render();
}

function savePay(sid){

/* ----- permissions: only the owner's verified shops can edit prices, items and sets ----- */
const editable=sh=>!!(sh&&sh.mine&&sh.verified&&S.user.verified);
const mgrShops=()=>S.shops.filter(editable);
const deskShops=()=>S.shops.filter(sh=>editable(sh)||DEMO_MODE);       // demo only: sample shops may use the desk (never edit)
const dayStart=()=>{ const b=new Date(Date.now()+BKK); return Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate(),-7,0); };
function undoOrder(o){                                                    // give the reserved stock (and coupon) back after a cancel / reject / timeout
  if(o.buyer==='me'&&o.cp){ S.coupons++; o.cp=false; }
  const sh=S.shops.find(x=>x.id===o.shopId); if(!sh) return;
  if(cloudShop(sh)){ applyStock(); return; }
  const L=o.lk==='item'?sh.items:o.lk==='bundle'?sh.bundles:sh.sets, r=(L||[]).find(x=>x.id===o.lid);
  if(r&&o.ts>=(r.ep||0)){ r.left=Math.min(r.qty,r.left+o.qty); if(r.left>0) r.soldAt=0; }
}
function sweepOrders(){
  if(PROD) return false;                                                    // the server decides when reservations expire
  let ch=false, exp=false;
  S.orders.forEach(o=>{
    if(o.status==='pending'&&o.buyer==='me'&&Date.now()>o.ts+PAY_WINDOW){ o.status='cancelled'; undoOrder(o); ch=true; exp=true; S.unpaid=(S.unpaid||[]).concat(Date.now()).slice(-10); return; }
    if(o.status!=='paid'&&o.status!=='review') return;
    const sh=S.shops.find(x=>x.id===o.shopId);
    if(sh&&isTimed(sh)&&Date.now()>sh.endAt+GRACE){ o.status='expired'; ch=true; }
  });
  if(ch) save();
  if(exp) toast(t('payExpiredToast'));
  return ch;
}
function awardBuyer(o){
  if(o.buyer!=='me'||PROD) return;                                           // production: eco totals come from the server
  S.kg=Math.round((S.kg+(o.foodN||0)*0.3)*10)/10; S.itemsSaved+=o.nonN||0;
  S.baht+=Math.max(0,o.worth-o.price); S.points+=15; S.boxes++; checkBadges();
}

function openDesk(sid){
  if(!S.user.verified) return needVerify(()=>openDesk(sid));
  const list=deskShops();

function deskDecide(sid,oid,to){

async function deskConfirm(sid,raw){
  const sh=S.shops.find(x=>x.id===sid); if(!sh||!(editable(sh)||DEMO_MODE)) return toast(t('notEditable'));
  const code=String(raw||'').trim().toUpperCase().split('|').pop().replace(/\s+/g,'');
  if(!/^CDE-[A-Z0-9]{4,12}$/.test(code)) return toast(t('scanBadCode'));
  if(PROD) return Srv.pickup(sid,code);
  const h=await chash(code);
  const o=S.orders.find(x=>x.shopId===sid&&(x.buyer==='remote'?(!!h&&x.ch===h):x.code===code));
  if(!o) return toast(t('scanBadCode'));
  if(isTimed(sh)&&Date.now()>sh.endAt+GRACE&&o.status==='paid'){ o.status='expired'; save(); return toast(t('orderExpired')); }
  if(o.status==='pending'||o.status==='review') return toast(t('notPaidYet'));
  if(o.status!=='paid') return toast(t('scanUsed'));
  o.status='done'; awardBuyer(o); commit(); toast(t('scanOkPickup',{set:orderTitle(o)}));
  render(); openDesk(sid);
}
async function startScan(sid){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return toast(t('scanNoCam'));
  const detector=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  if(!detector&&!window.jsQR) return toast(t('scanNoCam'));
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }catch(e){ return toast(t('scanNoCam')); }
  const el=document.createElement('div'); el.id='scanner';
  el.className='fixed inset-0 z-[95] flex flex-col items-center justify-center p-4'; el.style.background='rgba(10,6,20,.95)';
  el.innerHTML=`<video playsinline muted style="width:100%;max-width:420px;border-radius:16px"></video><div class="text-white text-sm mt-3 text-center">${t('scanHint')}</div><button class="btn ghost mt-4" style="color:#fff;border-color:#ffffff55">${t('close')}</button>`;
  document.body.appendChild(el);
  const video=el.querySelector('video'), canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
  let stop=false; const finish=()=>{ stop=true; stream.getTracks().forEach(tr=>tr.stop()); el.remove(); };
  el.querySelector('button').onclick=finish;
  video.srcObject=stream; try{ await video.play(); }catch(e){}
  const loop=async()=>{
    if(stop) return;
    if(video.readyState>=2&&video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0);
      let txt=''; try{
        if(detector){ const r=await detector.detect(canvas); if(r[0]) txt=r[0].rawValue; }
        else { const d=ctx.getImageData(0,0,canvas.width,canvas.height), r=window.jsQR(d.data,d.width,d.height); if(r) txt=r.data; }
      }catch(e){}
      if(txt){ finish(); deskConfirm(sid,txt); return; }
    }
    requestAnimationFrame(loop);
  };
  loop();
}

/* ---------- QR ---------- */
/* Real QR via qrcode-generator (cdnjs). Falls back to a decorative pattern if the library didn't load.
   Production: payload must be a server-signed, single-use, expiring token — not a plain order code. */
function pseudoQr(text){
  const N=21; let h=2166136261; for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
  const f=(x,y)=>[[0,0],[N-7,0],[0,N-7]].some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7);
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let on;
    if(f(x,y)){ const [a,b]=[[0,0],[N-7,0],[0,N-7]].find(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7); const dx=x-a,dy=y-b; on=(dx==0||dx==6||dy==0||dy==6)||(dx>=2&&dx<=4&&dy>=2&&dy<=4); }
    else on=rnd()>.5;
    if(on) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" width="176" height="176" style="background:#fff;border-radius:12px;padding:6px" fill="#1b1530" role="img" aria-label="QR ${esc(text)}">${r}</svg>`;
}
function qrSvg(text){
  try{
    if(window.qrcode){
      const q=window.qrcode(0,'M'); q.addData(text); q.make();
      const n=q.getModuleCount(), m=2; let d='';
      for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m},${r+m}h1v1h-1z`;
      return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" width="190" height="190" style="background:#fff;border-radius:12px" shape-rendering="crispEdges" role="img" aria-label="QR ${esc(text)}"><path d="${d}" fill="#1b1530"/></svg>`;
    }
  }catch(e){}
  return pseudoQr(text);
}

async function slipSend(f,id){

/* ---------- Buy flow ---------- */
const GRACE=15*60000, ACTIVE=['paid'], PAY_WINDOW=15*60000;
/* ---------- Anti-fraud ----------
   No server => rules are enforced by every honest client from the shared DB (owner-only write rules keep each party in its own doc).
   • a buyer can never mark an order paid; only the shop's own confirm counts  • unique satang per open order (match key, stops slip re-use)
   • open-order cap + unpaid cooldown  • 2 different shops rejecting a "paid" claim in 30 days -> buyer blocked from new reservations
   • 3 different buyers (orders confirmed by the shop) reporting in 30 days -> shop paused  • new shops capped until 3 buyers served
   Known limits: a modified client or colluding accounts can bypass these; real launch needs server-side checks + KYC. */
const MAX_OPEN=3, STRIKE_N=2, REPORT_N=3, WIN30=30*864e5, NEW_DONE=3, NEW_CAP=300, NEW_OPEN=5, UNPAID_MAX=3, UNPAID_LOCK=60*60000;
const RP=['noitem','wrong','overcharge','fake'];
const ownerOf=sh=>sh.remote?sh.owner:(sh.mine?Cloud.uid:'');
const amtOf=o=>(Math.round(o.price*100)+(Math.min(99,Math.max(0,Math.floor(+o.sat||0)))))/100;
function openFor(sh){
  const seen=new Set(), now=Date.now(); let n=0;
  const add=(id,e)=>{ if(seen.has(id)) return; seen.add(id); if(+e.shopId!==sh.id) return; const s=e.status; if(s==='paid'||s==='review'||(s==='pending'&&now<=+e.ts+PAY_HOLD)) n++; };
  S.orders.forEach(o=>add(String(o.id),o)); Cloud.claims.forEach((e,id)=>add(id,e)); return n;
}
function uniqueSat(sh){
  const used=new Set(), now=Date.now(), seen=new Set();
  const add=(id,e)=>{ if(seen.has(id)) return; seen.add(id); if(+e.shopId===sh.id&&(e.status==='review'||(e.status==='pending'&&now<=+e.ts+PAY_HOLD))&&+e.sat>0) used.add(Math.floor(+e.sat)); };
  S.orders.forEach(o=>add(String(o.id),o)); Cloud.claims.forEach((e,id)=>add(id,e));
  const free=[]; for(let i=1;i<=99;i++) if(!used.has(i)) free.push(i);
  return free.length?free[crypto.getRandomValues(new Uint32Array(1))[0]%free.length]:0;
}
function buyGuard(sh,total,mode){                                         // -> [textKey, vars] or null
  if(Cloud.on&&Cloud.blocked.has(Cloud.uid)) return ['acctLimited',{}];
  const open=S.orders.filter(o=>o.buyer==='me'&&(o.status==='pending'||o.status==='review')).length;
  if(open>=MAX_OPEN) return ['tooManyOpen',{n:open}];
  const now=Date.now(), un=(S.unpaid||[]).filter(x=>x>now-864e5);
  if(un.length>=UNPAID_MAX){ const left=Math.max(...un)+UNPAID_LOCK-now; if(left>0) return ['unpaidLock',{m:Math.ceil(left/60000)}]; }
  if(mode==='qr'&&cloudShop(sh)){
    if((Cloud.done[sh.id]||0)<NEW_DONE){ if(total>NEW_CAP) return ['newShopCap',{n:NEW_CAP}]; if(openFor(sh)>=NEW_OPEN) return ['newShopBusy',{}]; }
  }
  return null;
}
const capWorth=(w,p)=>w>p*10?0:w;                                         // absurd "original price" claims are dropped
/* ---------- PromptPay (EMV-QR / Thai QR Payment) ---------- */
const digits=v=>String(v==null?'':v).replace(/\D/g,'');
const ppValid=v=>/^0\d{9}$/.test(v)||/^\d{13}$/.test(v)||/^\d{15}$/.test(v);
const acctValid=v=>/^\d{10,15}$/.test(v);
const payOk=p=>!!(p&&typeof p==='object'&&p.name&&(ppValid(p.pp)||acctValid(p.acct)));
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?(((c<<1)^0x1021)&0xFFFF):((c<<1)&0xFFFF); } return c.toString(16).toUpperCase().padStart(4,'0'); }
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function ppPayload(id,amount){
  const d=digits(id); let tag,sub;
  if(/^0\d{9}$/.test(d)){ tag='01'; sub='0066'+d.slice(1); } else if(/^\d{13}$/.test(d)){ tag='02'; sub=d; } else if(/^\d{15}$/.test(d)){ tag='03'; sub=d; } else return '';
  const a=Number(amount), amt=(Number.isFinite(a)&&a>0)?a.toFixed(2):'';
  const s=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('29',tlv('00','A000000677010111')+tlv(tag,sub))+tlv('53','764')+(amt?tlv('54',amt):'')+tlv('58','TH')+'6304';
  return s+crc16(s);
}
function qrSvgReal(text,label){                                           // payment QR must be a real, scannable code: never the decorative fallback
  try{
    if(!window.qrcode||!text) return '';
    const q=window.qrcode(0,'M'); q.addData(text); q.make();
    const n=q.getModuleCount(), m=4; let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m},${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" width="220" height="220" style="background:#fff;border-radius:12px;max-width:100%" shape-rendering="crispEdges" role="img" aria-label="${esc(label||'QR')}"><path d="${d}" fill="#000"/></svg>`;
  }catch(e){ return ''; }
}
function cleanPay(p){
  if(!p||typeof p!=='object') return null;
  const o={pp:digits(p.pp).slice(0,15),name:cleanAddr(p.name).slice(0,40),bank:cleanAddr(p.bank).slice(0,30),acct:digits(p.acct).slice(0,15),ts:Math.max(0,Math.min(Date.now(),Math.floor(Number(p.ts)||0)))};
  if(!ppValid(o.pp)) o.pp=''; if(!acctValid(o.acct)) o.acct='';
  return (o.name&&(o.pp||o.acct))?o:null;
}
function payErr(p){
  if(p.pp&&!ppValid(p.pp)) return 'payBadPP';
  if(p.acct&&!acctValid(p.acct)) return 'payBadAcct';
  if(!p.name) return 'payNameNeed';

  if(!ppValid(p.pp)&&!acctValid(p.acct)) return 'payNeed';
  return '';
}

const payMode=(sh,total)=>sh.type==='chain'?'store':((payOk(sh.pay)||(PROD&&sh.hasPay))?(total>0?'qr':'store'):(DEMO_MODE&&!sh.remote&&!sh.mine?'sim':'none'));

const rid8=()=>Array.from(crypto.getRandomValues(new Uint32Array(3)),n=>n.toString(36)).join('').slice(0,12).toUpperCase();     // 12 chars: unguessable even though its hash is shared

async function pay(sid,kind,id){
  if(pay.busy) return; pay.busy=true;
  try{ await pay1(sid,kind,id); } finally{ pay.busy=false; }
}
async function pay1(sid,kind,id){
  const sh=S.shops.find(x=>x.id===sid), o=sh&&offerOf(sh,kind,id);
  const qty=kind==='box'?1:Math.min(Math.max(1,BUY.qty),MAX_QTY);
  if(PROD) return Srv.pay(sid,kind,id,qty);                                   // price, stock, limits and the pickup code are decided by the server
  if(!o){ closeSheet(); render(); return toast(t('listingEnded')); }
  if(o.state==='soldout'||(o.state==='live'&&o.left<=0)){ closeSheet(); render(); return toast(t('itemSoldOut',{name:offerTitle(o)})); }
  if(o.state!=='live'){ closeSheet(); render(); return toast(t('listingEnded')); }
  if(o.left<qty){ BUY.qty=o.left; return toast(t('stockLeft',{n:o.left})); }
  if(sh.mine) return toast(t('ownShop'));
  if(!shopOpen(sh)){ closeSheet(); render(); return toast(t('closedToast')); }
  const price=Math.max(0,o.price*qty-couponOff()), mode=payMode(sh,price);
  if(mode==='none'){ closeSheet(); return toast(t('payNotSet')); }
  const ge=buyGuard(sh,price,mode); if(ge){ closeSheet(); return toast(t(ge[0],ge[1])); }
  const cp=S.coupons>0; if(cp) S.coupons--;

/* ---------- Secure chat ---------- */
const BLOCK_WORDS=[
  'ไลน์','ไอจี','เฟสบุ๊ก','โง่','ควาย','ฆ่าแก','ฆ่ามึง','ไปห้อง','ขึ้นห้อง','ขึ้นไปห้อง',
  'lineid','@line','whatsapp','wechat','telegram','instagram','facebook','addmeon','stupid','idiot','killyou','tomyroom','toyourroom',
  '微信','加我','手机号','手機號','傻','白痴','杀了你','殺了你','来我房间','來我房間','去你房间',
  'ライン交換','ラインid','ライン教えて','ライン追加','連絡先','インスタ','バカ','ばか','殺す','部屋に来','部屋へ来'
];
function blocked(tx){
  const x=tx.normalize('NFKC').toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[๐-๙]/g,c=>String(c.charCodeAt(0)-0xE50));
  const digits=x.replace(/(\d)[\s.\-()]+(?=\d)/g,'$1');            // 08 1234 5678 → joined; times like 18.00-21.00 and dates stay short
  if(/0[2-9]\d{7,8}/.test(digits)||/\d{10,}/.test(digits)) return t('blockedPhone');
  const y=x.replace(/\s+/g,'').replace(/ออนไลน์/g,'').replace(/オンライン/g,'').replace(/online/g,'');
  if(BLOCK_WORDS.some(w=>y.includes(w))) return t('blockedWord');
  return '';
}

  if(PROD) return commChat(id);
  const p=S.posts.find(x=>x.id===id); if(!p||p.mine) return toast(t('ownPost'));
  needVerify(()=>{

    drawChat(p);
  });

function msgHtml(m){ return `<div class="flex ${m.me?'justify-end':''}"><div class="px-3 py-2 rounded-2xl max-w-[80%] text-sm break-words" style="background:${m.me?'var(--ink)':'var(--soft)'};color:${m.me?'#fff':'inherit'}">${esc(m.t)}</div></div>`; }
function drawChat(p){
  const c=window._chat;
  sheet(`<div class="flex items-center justify-between gap-2 mb-2"><div class="display text-lg min-w-0 truncate">${t('chatWith',{n:esc(pby(p))})}</div><button class="chip" onclick="report(${+p.id})">${t('report')}</button></div>

    <button class="btn jade w-full mt-3" onclick="claim(${+p.id})">${t('handoverDone')}</button>`);

function pushMsg(m){ window._chat.msgs.push(m); const box=$('#msgs'); if(box) box.insertAdjacentHTML('beforeend',msgHtml(m)); }
function sendChat(){
  const inp=$('#cm'); if(!inp) return; const v=inp.value.trim(); if(!v) return;
  const b=blocked(v); if(b) return toast(b);
  const cid=window._chat.id; inp.value=''; pushMsg({me:true,t:v}); inp.focus();
  setTimeout(()=>{ if(window._chat&&window._chat.id===cid) pushMsg({me:false,t:t('chatReply')}); },900);
}

  if(++tickN%10===0){ const g=catalogSig(); if(g!==sig){ const first=sig===''; sig=g; if(!first){ render(); return; } } }      // sold-out listings clear themselves
  document.querySelectorAll('[data-end]').forEach(e=>{ const l=+e.dataset.end-Date.now(); e.textContent=l<=0?t('ended'):fmt(l); if(l<=0&&!e.dataset.done){e.dataset.done=1; render();} });
  const st=document.querySelector('[data-start]'); if(st) st.textContent=fmt(nextStart()-Date.now());
},1000);

function initData(){
  const day=bkkISO(), rollover=S.seedDay!==day;
  if(!Array.isArray(S.notices)) S.notices=[];
  try{
    const old=Array.isArray(S.shops)?S.shops:[];
    if(!old.length||S.seedDay!==day||S.schema!==6){            // new day / new schema: restock; keep trust scores and registered shops
      const mine=old.filter(x=>x&&x.mine).map(x=>{
        const sh={...x};
        if(!Array.isArray(sh.items)) sh.items=((S.menuAdds&&S.menuAdds[sh.id])||[]).map(m=>({id:m.id,name:m.name,price:m.price,worth:0,cat:m.cat,qty:1,left:1,img:m.img,exp:'',fda:'',size:''}));
        sh.bundles=Array.isArray(sh.bundles)?sh.bundles:[];
        if(isTimed(sh)){ sh.endAt=endAtFor(sh.endHM); }                                  // food listings are NOT restocked: they end with the day and must be relisted
        if(rollover&&sh.verified&&[...(sh.items||[]),...(sh.bundles||[]),...(sh.sets||[])].some(r=>r&&r.auto===true)) pushNotice(sh,{type:'daycut',kind:'item',name:'',n:0});
        return sh;
      });
      S.shops=demoSeeds().map(n=>{const o=old.find(x=>x&&x.id===n.id); return o?{...n,trust:o.trust,n:o.n}:n;}).concat(mine);
      S.seedDay=day; S.schema=6;
    }
    if(!Array.isArray(S.posts)) S.posts=demoPosts();
  }catch(e){ S.shops=demoSeeds(); S.seedDay=day; S.schema=6; S.posts=demoPosts(); }
  sanitizeState();
  S.shops.forEach(purgeOld);
}
function purgeOld(sh){                                                     // drop listings that ended more than a week ago
  if(!sh.mine) return;
  const cut=isoPlus(-7), cutTs=Date.now()-7*864e5, old=(x,st)=>x.auto!==true&&((st==='stale'&&x.d<cut)||(st==='cleared'&&x.soldAt<cutTs));   // standing items are kept
  sh.items=sh.items.filter(x=>!old(x,itemState(sh,x))); sh.bundles=sh.bundles.filter(b=>!old(b,bundleState(sh,b))); sh.sets=sh.sets.filter(x=>!old(x,boxState(sh,x)));
  reconcileBundles(sh);
}

      dist:Math.min(3,Math.max(0,num(x.dist,1))),trust:Math.min(5,Math.max(0,num(x.trust,4.5))),n:Math.max(1,Math.floor(num(x.n,2))),endAt:num(x.endAt,Date.now()+36e5),mine:x.mine===true,verified:x.verified===true,verifiedAt:num(x.verifiedAt,0),endHM:END_TIMES.includes(x.endHM)?x.endHM:'',addr:cleanAddr(x.addr),lat:validLL(+x.lat,+x.lng)?Math.round(+x.lat*1e5)/1e5:null,lng:validLL(+x.lat,+x.lng)?Math.round(+x.lng*1e5)/1e5:null,remind:{on:!!(x.remind&&x.remind.on===true),hm:(x.remind&&REMIND_TIMES.includes(x.remind.hm))?x.remind.hm:'07:30'},items,bundles,sets};
