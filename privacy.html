const TXT={"th": "\n<p class=\"muted\">เวอร์ชัน {{VERSION}} · ใช้กับเว็บแอปและแอปมือถือ CountDown Eats (\"แอป\")</p>\n<h3>1. ผู้ควบคุมข้อมูลส่วนบุคคล</h3>\n<p>{{OPERATOR}} (\"เรา\") เป็นผู้ให้บริการแอปและเป็นผู้ควบคุมข้อมูลส่วนบุคคลตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (\"PDPA\") ที่อยู่: {{ADDRESS}} ช่องทางติดต่อเรื่องข้อมูลส่วนบุคคล: {{CONTACT}}</p>\n<h3>2. ข้อมูลที่เราเก็บ</h3>\n<ul>\n<li><b>บัญชี:</b> เมื่อเข้าสู่ระบบด้วย Google เราได้รับรหัสบัญชี ชื่อ และอีเมลของคุณ เราไม่ได้รับรหัสผ่าน Google ของคุณ</li>\n<li><b>หากลงทะเบียนร้านค้า:</b> ชื่อร้าน ที่อยู่ ตำแหน่งบนแผนที่ เวลาขาย เมนู ราคา รูปภาพที่อัปโหลด และข้อมูลรับเงินที่คุณกรอก (เบอร์พร้อมเพย์หรือเลขบัญชี และชื่อบัญชี)</li>\n<li><b>คำสั่งซื้อ:</b> รายการที่จอง ยอดเงิน สถานะ (รอชำระ / ชำระแล้ว / รับของแล้ว / ยกเลิก) เวลา รหัสรับของ รายงานและคะแนนที่คุณส่ง</li>\n<li><b>ตำแหน่งที่ตั้ง:</b> ใช้ตำแหน่งจากโทรศัพท์เพื่อแสดงร้านใกล้เคียงและระยะทาง การคำนวณทำบนเครื่องของคุณ ส่วนการค้นหาร้านใกล้เคียงแอปส่งพิกัดโดยประมาณ (ปัดเศษประมาณ 1 กม.) ไปยังเซิร์ฟเวอร์เพื่อตอบคำขอนั้นเท่านั้น และเราไม่บันทึกพิกัดไว้ คุณปฏิเสธการเข้าถึงตำแหน่งและค้นหาด้วยชื่อร้านแทนได้</li>\n<li><b>ข้อมูลทางเทคนิค:</b> ที่อยู่ IP และบันทึกคำขอที่ผู้ให้บริการโฮสติ้งเก็บเพื่อความปลอดภัย และค่าตั้งต้น (ภาษา รัศมี) ที่เก็บในเครื่องคุณ</li>\n<li><b>โฆษณา (เฉพาะแอปมือถือ):</b> แอปมือถือแสดงโฆษณาจาก Google AdMob ซึ่งอาจใช้รหัสโฆษณาของอุปกรณ์ เว็บแอปไม่แสดงโฆษณา</li>\n</ul>\n<p>เราไม่เก็บเลขบัตรประชาชน เลขบัตรเครดิต หรือสลิปการโอนเงินของคุณ การชำระเงินทำโดยตรงระหว่างคุณกับร้านค้านอกแอป</p>\n<h3>2A. ข้อมูลการเติมเครดิตและสลิป (ร้านค้า)</h3>\n<p>เมื่อร้านค้าเติมเครดิต เราเก็บยอดเงิน เวลา สถานะรายการ เลขอ้างอิงสลิป ใบเสร็จ (เลขที่ ยอดก่อนภาษี ภาษี ยอดรวม ข้อมูลผู้ให้บริการ ณ วันออก) และบันทึกการยอมรับเงื่อนไขเครดิต เพื่อตรวจสอบการชำระเงิน ออกใบเสร็จ และป้องกันการใช้สลิปซ้ำ ฐานทางกฎหมาย: การปฏิบัติตามสัญญา ประโยชน์โดยชอบด้วยกฎหมายในการป้องกันการฉ้อโกง และหน้าที่ตามกฎหมายภาษี ภาพหรือข้อมูลสลิปที่คุณส่งอาจถูกส่งไปยังผู้ให้บริการตรวจสอบสลิป (เช่น EasySlip) เพื่อยืนยันยอดและบัญชีผู้รับเท่านั้น เราเก็บข้อมูลใบเสร็จตามระยะเวลาที่กฎหมายภาษีกำหนด</p>\n<h3>3. วัตถุประสงค์และฐานทางกฎหมาย</h3>\n<ul>\n<li>เพื่อให้บริการ (บัญชี รายการสินค้า การจอง การยืนยันรับของ) – <i>เพื่อการปฏิบัติตามสัญญา</i></li>\n<li>เพื่อป้องกันการฉ้อโกงและการใช้งานที่ไม่เหมาะสม (จำกัดจำนวนการจองที่ค้างอยู่ ล็อกเมื่อไม่ชำระ ระงับร้านเมื่อมีรายงานที่ยืนยันแล้ว ระงับบัญชีที่ละเมิด) – <i>ประโยชน์โดยชอบด้วยกฎหมาย</i></li>\n<li>เพื่อแสดงร้านใกล้เคียงตามตำแหน่ง – <i>ความยินยอมของคุณ</i> (สิทธิ์ตำแหน่งในอุปกรณ์) ถอนได้ทุกเมื่อในการตั้งค่าอุปกรณ์</li>\n<li>เพื่อแสดงโฆษณาในแอปมือถือ – <i>ความยินยอมของคุณ</i> ในกรณีที่กฎหมายกำหนด</li>\n<li>เพื่อปฏิบัติตามกฎหมายและตอบคำขอที่ชอบด้วยกฎหมาย – <i>หน้าที่ตามกฎหมาย</i></li>\n</ul>\n<h3>4. การตัดสินใจอัตโนมัติ</h3>\n<p>มาตรการป้องกันบางอย่างทำงานอัตโนมัติด้วยกฎบนเซิร์ฟเวอร์ เช่น ผู้ซื้อที่แจ้งว่าโอนแล้วแต่ถูกร้านที่น่าเชื่อถือ 2 ร้านปฏิเสธภายใน 30 วัน อาจถูกจำกัดการจองใหม่ชั่วคราว ร้านที่ถูกผู้ซื้อ 3 ราย (คนละบัญชี) รายงานที่ยืนยันแล้วภายใน 30 วันจะถูกซ่อนจนกว่าจะตรวจสอบ หากเห็นว่าผิดพลาด ติดต่อเรา เจ้าหน้าที่จะตรวจสอบให้</p>\n<h3>5. ใครเห็นข้อมูลของคุณ</h3>\n<ul>\n<li><b>ร้านค้า</b> เห็นเพียงรหัสผู้ซื้อแบบนิรนาม รายการและยอดของคำสั่งซื้อ และสถานะ – ไม่เห็นชื่อ อีเมล หรือรหัส Google ของคุณ</li>\n<li><b>ผู้ซื้อ</b> ที่จองสินค้าจากร้านนั้นเห็นชื่อร้าน ที่อยู่ และข้อมูลรับเงินของร้าน</li>\n<li><b>ผู้ให้บริการ</b> ที่ช่วยให้แอปทำงาน: Supabase (ฐานข้อมูล การยืนยันตัวตน เก็บรูป) Google (เข้าสู่ระบบ AdMob) GitHub (โฮสต์เว็บไซต์) ประมวลผลตามคำสั่งของเราหรือตามข้อกำหนดของผู้ให้บริการ</li>\n<li><b>หน่วยงานรัฐ</b> เมื่อกฎหมายกำหนด เราไม่ขายข้อมูลส่วนบุคคล</li>\n</ul>\n<h3>6. การส่งข้อมูลไปต่างประเทศ</h3>\n<p>ฐานข้อมูลของเราตั้งอยู่ที่ {{REGION}} Google และ GitHub ก็ดำเนินงานนอกประเทศไทยเช่นกัน เราอาศัยมาตรการคุ้มครองตามสัญญาและมาตรการรักษาความปลอดภัยของผู้ให้บริการ และจะดูแลให้ประเทศปลายทางมีมาตรฐานคุ้มครองที่เพียงพอตาม PDPA เมื่อกฎหมายกำหนด</p>\n<h3>7. ระยะเวลาเก็บรักษา</h3>\n<ul>\n<li>รายละเอียดคำสั่งซื้อ (รหัสรับของ ข้อมูลบัญชีรับเงินที่คัดลอกไว้): 30 วันหลังคำสั่งซื้อสิ้นสุด ส่วนบันทึกธุรกรรมแบบย่อ (เลขที่ออเดอร์ ร้าน สินค้า จำนวน ยอดเงิน เวลาที่จอง/แจ้งโอน/ร้านยืนยัน/รับของ ชื่อผู้รับเงินและเลขท้าย 4 หลักของบัญชี) เก็บ 12 เดือน เพื่อเป็นหลักฐานเมื่อมีข้อพิพาทเรื่องการชำระเงินและเพื่อป้องกันการโกง ยอดสะสมอาหารที่ช่วยไว้เก็บในโปรไฟล์จนกว่าคุณจะลบบัญชี</li>\n<li>รายการสินค้าและข้อมูลรับเงินของร้าน: จนกว่าจะลบร้านหรือลบบัญชี</li>\n<li>บันทึกการจำกัดความถี่: 2 วัน รูปภาพ: ลบออกจากที่เก็บเมื่อสินค้าถูกลบหรือหมดอายุ (ระบบทำงานอัตโนมัติทุกเที่ยงคืนเวลาไทย) หรือเมื่อคุณลบร้าน</li>\n<li>เมื่อคุณลบบัญชี เราจะลบโปรไฟล์ ร้านค้า ข้อมูลรับเงิน และการเข้าสู่ระบบ ส่วนคำสั่งซื้อและบันทึกธุรกรรมจะถูกตัดการเชื่อมโยงกับคุณ (ตัวบันทึกธุรกรรมยังเก็บตามระยะเวลาข้างต้น) ข้อมูลสำรองของผู้ให้บริการจะหมดอายุตามรอบปกติ</li>\n</ul>\n<h3>8. สิทธิของคุณ</h3>\n<p>ตาม PDPA คุณมีสิทธิขอเข้าถึงและขอสำเนาข้อมูล ขอให้โอนย้ายข้อมูล แก้ไข ลบ ระงับ หรือคัดค้านการประมวลผล และถอนความยินยอม ในแอปเมนู <b>โปรไฟล์ → ข้อมูลของฉัน</b> คุณดาวน์โหลดข้อมูลทั้งหมดที่เราเก็บและลบบัญชีได้ด้วยตนเอง คำขออื่นส่งมาที่ {{CONTACT}} เราตอบภายใน 30 วัน และคุณร้องเรียนต่อคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) ได้</p>\n<h3>9. ความปลอดภัย</h3>\n<p>การเข้าถึงข้อมูลถูกควบคุมที่เซิร์ฟเวอร์ (ไม่ใช่ในแอป) การเชื่อมต่อเข้ารหัส ข้อมูลรับเงินแสดงเฉพาะผู้ซื้อที่จองจากร้านนั้น และรหัสรับของสร้างโดยเซิร์ฟเวอร์ หากเกิดเหตุละเมิดข้อมูลที่น่าจะกระทบสิทธิของคุณ เราจะแจ้ง สคส. ภายใน 72 ชั่วโมงนับแต่ทราบเหตุ และแจ้งคุณโดยไม่ชักช้าเมื่อกฎหมายกำหนด</p>\n<h3>10. เด็กและเยาวชน</h3>\n<p>แอปนี้สำหรับผู้มีอายุ 20 ปีขึ้นไป ผู้ที่อายุต่ำกว่า 20 ปีใช้ได้เมื่อได้รับความยินยอมจากผู้ปกครอง เราไม่เก็บข้อมูลของเด็กโดยรู้ตัวหากไม่มีความยินยอมดังกล่าว หากพบ โปรดแจ้งเรา</p>\n<h3>11. คุกกี้และพื้นที่จัดเก็บ</h3>\n<p>เว็บแอปใช้พื้นที่จัดเก็บของเบราว์เซอร์เท่าที่จำเป็นสำหรับการเข้าสู่ระบบและค่าที่ตั้งไว้ ไม่มีคุกกี้ติดตามหรือโฆษณาในเว็บแอป</p>\n<h3>12. การเปลี่ยนแปลง</h3>\n<p>เราอาจปรับปรุงนโยบายนี้ หากข้อกำหนดหรือนโยบายเปลี่ยนในสาระสำคัญ จะขอให้คุณยอมรับเวอร์ชันใหม่ก่อนใช้งานการจองหรือจัดการร้านต่อ</p>\n", "en": "\n<p class=\"muted\">Version {{VERSION}} · applies to the CountDown Eats web app and mobile app (\"the App\").</p>\n<h3>1. Who we are</h3>\n<p>{{OPERATOR}} (\"we\") operates the App and is the data controller under the Thailand Personal Data Protection Act B.E. 2562 (2019) (\"PDPA\"). Address: {{ADDRESS}}. Contact (privacy requests): {{CONTACT}}.</p>\n<h3>2. What data we collect</h3>\n<ul>\n<li><b>Account:</b> when you sign in with Google we receive your Google account ID, name and email address. We do not receive your Google password.</li>\n<li><b>If you register a shop:</b> shop name, address, map position, opening hours, menu items, prices, photos you upload, and the payment-receiving details you enter (PromptPay number or bank account number and the account holder's name).</li>\n<li><b>Orders:</b> what you reserved, amount, status (pending / paid / picked up / cancelled), times, the pickup code, reports and ratings you submit.</li>\n<li><b>Location:</b> your phone's position is used to show nearby shops and distances. It is processed on your device; to search nearby shops the App sends approximate coordinates (rounded to about 1 km) to our server, which uses them only to answer that request and does not store them. You can refuse location permission and search by name instead.</li>\n<li><b>Technical data:</b> IP address and request logs kept by our hosting providers for security; settings (language, radius) stored on your device.</li>\n<li><b>Ads (mobile app only):</b> the mobile app shows ads from Google AdMob, which may use advertising identifiers. The web version shows no ads.</li>\n</ul>\n<p>We do not collect national ID numbers, card numbers or your payment slips. Payments are made directly between you and the shop outside the App.</p>\n<h3>2A. Top-up and slip data (shops)</h3>\n<p>When a shop tops up credit we keep the amount, time, status, slip reference, receipt (number, amount before tax, tax, total, provider details at issue date) and the record that you accepted the credit terms, to verify payment, issue receipts and prevent slip reuse. Legal bases: contract, our legitimate interest in preventing fraud, and tax-law obligations. A slip image or data you submit may be sent to a slip-verification provider (e.g. EasySlip) solely to confirm the amount and receiving account. Receipt data is kept for the period required by tax law.</p>\n<h3>3. Why we use it, and our legal basis</h3>\n<ul>\n<li>To provide the service (accounts, listings, reservations, pickup confirmation) – <i>performance of contract</i>.</li>\n<li>To prevent fraud and abuse (limits on open reservations, unpaid-order lock, shop suspension after confirmed reports, banning abusive accounts) – <i>legitimate interest</i>.</li>\n<li>To show nearby shops by location – <i>your consent</i> (device permission); you may withdraw it at any time in your device settings.</li>\n<li>To show ads in the mobile app – <i>your consent</i> where required.</li>\n<li>To comply with law and respond to lawful requests – <i>legal obligation</i>.</li>\n</ul>\n<h3>4. Automated decisions</h3>\n<p>Some protections are applied automatically by rules on our server, for example: a buyer whose \"I have paid\" claims were rejected by two reliable shops within 30 days may be temporarily limited from new reservations; a shop that receives confirmed reports from three different buyers within 30 days is hidden until reviewed. If you think this was wrong, contact us and a person will review it.</p>\n<h3>5. Who sees your data</h3>\n<ul>\n<li><b>Shops</b> see only an anonymous buyer tag, the items and amount of your order and its status – never your name, email or Google ID.</li>\n<li><b>Buyers</b> who reserve from a shop see the shop's name, address and payment-receiving details.</li>\n<li><b>Service providers</b> that run the App for us: Supabase (database, authentication, image storage), Google (sign-in, AdMob), GitHub (website hosting). They process data only on our instructions or under their own terms.</li>\n<li><b>Authorities</b> when required by law. We do not sell personal data.</li>\n</ul>\n<h3>6. Transfers abroad</h3>\n<p>Our database is hosted in {{REGION}}. Google and GitHub also operate outside Thailand. We rely on the providers' contractual safeguards and security measures; where required, we will ensure the destination offers adequate protection under the PDPA.</p>\n<h3>7. How long we keep data</h3>\n<ul>\n<li>Order details (pickup code, payment snapshot): 30 days after the order ends. A compact transaction record (order number, shop, item, quantity, amount, the times of reservation / payment claim / confirmation / pickup, recipient name and last 4 digits of the receiving account) is kept for 12 months as evidence for payment disputes and fraud prevention. Your totals of food saved stay in your profile until you delete your account.</li>\n<li>Shop listings and payment-receiving details: until you delete the shop or your account.</li>\n<li>Rate-limit logs: 2 days. Photos: deleted from storage when the product is removed or expires (a nightly job runs at midnight Thailand time), or when you delete the shop.</li>\n<li>When you delete your account, your profile, shops, payment-receiving details and login are deleted, and your orders and transaction records are unlinked from you (the transaction record itself is kept for the period above). Provider backups expire on their normal schedule.</li>\n</ul>\n<h3>8. Your rights</h3>\n<p>Under the PDPA you may request access to and a copy of your data, data portability, correction, deletion, restriction or objection to processing, and withdraw consent. In the App, <b>Profile → My data</b> lets you download everything we hold about you and delete your account yourself. For other requests write to {{CONTACT}}; we reply within 30 days. You may also complain to the Personal Data Protection Committee (PDPC) of Thailand.</p>\n<h3>9. Security</h3>\n<p>Access to data is controlled on the server (not in the app), connections are encrypted, payment-receiving details are shown only to buyers who reserved from that shop, and pickup codes are generated by the server. If a data breach is likely to harm you, we will notify the PDPC within 72 hours of becoming aware and notify you without delay where required.</p>\n<h3>10. Children</h3>\n<p>The App is for people aged 20 or over. People under 20 may use it only with the consent of a parent or guardian. We do not knowingly collect data from children without such consent; contact us if you believe we have.</p>\n<h3>11. Cookies and storage</h3>\n<p>The web app uses only essential browser storage for your sign-in session and preferences. No tracking or advertising cookies are set by the web app.</p>\n<h3>12. Changes</h3>\n<p>We may update this policy. When the terms or this policy change materially, you will be asked to accept the new version before continuing to place or manage orders.</p>\n"}, TT={th:"นโยบายความเป็นส่วนตัว (PDPA)",en:"Privacy Policy (PDPA)"}, VER="2026-10-14";
